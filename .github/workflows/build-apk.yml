
name: Build Fabric Analyzer APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.2
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract project
        run: |
          mkdir -p source
          unzip -q FabricAnalyzer_Android_Project.zip -d source

      - name: Locate project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=$(dirname "$(find source -name settings.gradle -print -quit)")
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "Project not found"
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Fix Java and Kotlin versions
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["PROJECT_DIR"]) / "app" / "build.gradle"
          content = path.read_text()

          if re.search(r'compileOptions\s*\{', content):
              content = re.sub(
                  r'compileOptions\s*\{.*?\}',
                  """compileOptions {
                      sourceCompatibility JavaVersion.VERSION_17
                      targetCompatibility JavaVersion.VERSION_17
                  }""",
                  content,
                  count=1,
                  flags=re.S
              )
          else:
              content = re.sub(
                  r'(android\s*\{)',
                  r'''\1
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              ''',
                  content,
                  count=1
              )

          if re.search(r'kotlinOptions\s*\{', content):
              content = re.sub(
                  r'kotlinOptions\s*\{.*?\}',
                  """kotlinOptions {
                      jvmTarget = '17'
                  }""",
                  content,
                  count=1,
                  flags=re.S
              )
          else:
              content = re.sub(
                  r'(android\s*\{)',
                  r'''\1
              kotlinOptions {
                  jvmTarget = '17'
              }
              ''',
                  content,
                  count=1
              )

          path.write_text(content)
          print("Java and Kotlin targets set to 17")
          PY

      - name: Build APK
        run: |
          cd "${{ steps.project.outputs.dir }}"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FabricAnalyzer-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
