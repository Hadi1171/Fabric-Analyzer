
name: Build Fabric Analyzer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract project
        run: |
          mkdir source
          unzip -q FabricAnalyzer_Android_Project.zip -d source

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find source -name settings.gradle -print -quit)")
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FabricAnalyzer-APK
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
