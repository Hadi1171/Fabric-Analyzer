name: Build Fabric Analyzer APK (Capacitor)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/android-windows-builds
    paths:
      - "index.html"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/build-android-capacitor.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install JavaScript dependencies
        run: npm install

      - name: Prepare web app
        run: npm run prepare:mobile

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate application icons
        run: npm run icons:generate

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FabricAnalyzer-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
