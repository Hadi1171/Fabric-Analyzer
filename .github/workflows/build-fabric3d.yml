name: Build Fabric 3D (Windows)

on:
  workflow_dispatch:
  push:
    branches: [fabric-3d-dev]
    paths:
      - "fabric3d/**"
      - ".github/workflows/build-fabric3d.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: fabric3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: fabric3d/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile app.py
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "Fabric 3D" app.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Fabric-3D-v0.1.0-Windows
          path: fabric3d/dist/Fabric 3D.exe
          if-no-files-found: error
