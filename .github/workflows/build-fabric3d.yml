name: Build Fabric 3D Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [fabric-3d-dev]
    paths:
      - "fabric3d/**"
      - ".github/workflows/build-fabric3d.yml"
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: fabric3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate app icon
        run: python make_icon.py
      - name: Syntax check
        run: python -m py_compile app.py make_icon.py
      - name: Build standalone application
        run: pyinstaller --noconfirm --clean --onefile --windowed --icon fabric3d_icon.ico --name "Fabric 3D" app.py
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build configurable Windows installer
        shell: cmd
        run: '"C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" "setup.iss"'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Fabric-3D-Setup-v0.2.0-Windows
          path: fabric3d/dist/Fabric-3D-Setup-v0.2.0.exe
          if-no-files-found: error
      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: Fabric-3D-Portable-v0.2.0
          path: fabric3d/dist/Fabric 3D.exe
          if-no-files-found: error
