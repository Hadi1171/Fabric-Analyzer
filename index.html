
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Fabric Analyzer</title>

<style>
:root{
  --bg:#10141d;
  --top:#191e29;
  --panel:#202633;
  --panel2:#282f3e;
  --panel3:#333d4f;
  --text:#edf1f8;
  --muted:#9ba8bb;
  --accent:#d8ad68;
  --border:#394456;
  --danger:#a9424b;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Tahoma,"Segoe UI",Arial,sans-serif;
  font-size:13px;
  overflow-x:hidden;
}

button,input{font-family:inherit}

button{
  border:1px solid var(--border);
  background:var(--panel2);
  color:var(--text);
  border-radius:7px;
  cursor:pointer;
  transition:.15s;
}

button:hover{background:var(--panel3)}
button:active{transform:scale(.96)}
button:disabled{opacity:.3;cursor:not-allowed;transform:none}

.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* نوار بالایی */

.topbar{
  height:54px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  background:var(--top);
  border-bottom:1px solid #30394a;
  direction:rtl;
}

.brand{
  font-size:17px;
  font-weight:800;
  letter-spacing:.5px;
}

.brand span{color:var(--accent)}

.topbar-right,.topbar-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.save-status{
  color:#8fc9a8;
  font-size:11px;
}

.topbar-label{
  color:var(--muted);
  font-size:11px;
}

/* ساختار اصلی */

.main-layout{
  flex:1;
  min-height:calc(100vh - 54px);
  display:grid;
  grid-template-columns:58px minmax(0,1fr) 300px;
  direction:ltr;
}

/* نوار ابزار سمت چپ */

.left-toolbar{
  background:var(--top);
  border-right:1px solid #30394a;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  padding:12px 7px;
  direction:rtl;
}

.tool-button{
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid transparent;
  background:transparent;
  color:#b8c3d3;
  border-radius:8px;
  padding:0;
}

.tool-button:hover{
  background:#30394a;
  color:white;
}

.tool-button.active{
  background:#3c4657;
  border-color:var(--accent);
  color:var(--accent);
}

.tool-button svg{
  width:21px;
  height:21px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.tool-divider{
  width:28px;
  height:1px;
  background:#3a4557;
  margin:5px 0;
}

.tool-spacer{flex:1}

.tool-button.danger{color:#e58c98}
.tool-button.success{color:#9ed9bb}

/* محیط بوم */

.center-stage{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:#111722;
  direction:rtl;
}

.stage-header{
  height:43px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  background:#1b2230;
  border-bottom:1px solid #30394a;
}

.stage-title{
  color:#c7d1df;
  font-size:12px;
  font-weight:700;
}

.stage-hint{
  color:#8492a7;
  font-size:10px;
}

.canvas-area{
  flex:1;
  min-height:300px;
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background-color:#101b35;
  background-image:
    radial-gradient(rgba(255,255,255,.035) .7px,transparent .7px);
  background-size:18px 18px;
}

.canvas-wrap{
  width:100%;
  height:100%;
  overflow:auto;
  direction:ltr;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  background:#101b35;
  border:1px solid #34445f;
  border-radius:8px;
  padding:12px;
  touch-action:pan-x pan-y;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}

canvas{
  display:block;
  flex-shrink:0;
  max-width:none;
  height:auto;
  cursor:crosshair;
  touch-action:pan-x pan-y;
}

.stage-footer{
  min-height:30px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:4px 14px;
  background:#1b2230;
  border-top:1px solid #30394a;
  color:#8592a5;
  font-size:10px;
}

/* پنل سمت راست */

.right-dock{
  background:var(--panel);
  border-left:1px solid #30394a;
  direction:rtl;
  min-width:0;
  overflow-y:auto;
  padding:12px;
}

.dock-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:3px 3px 12px;
  margin-bottom:10px;
  border-bottom:1px solid var(--border);
}

.dock-heading strong{
  font-size:13px;
  color:#e9eef7;
}

.dock-heading span{
  color:var(--muted);
  font-size:10px;
}

.dock-panel{
  background:#252d3b;
  border:1px solid #394456;
  border-radius:9px;
  margin-bottom:10px;
  overflow:hidden;
}

.dock-panel summary{
  height:42px;
  padding:0 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
  list-style:none;
  user-select:none;
  color:#e5eaf2;
  font-size:12px;
  font-weight:700;
}

.dock-panel summary::-webkit-details-marker{display:none}

.dock-panel summary::after{
  content:"⌄";
  color:var(--accent);
  font-size:18px;
  transition:transform .15s;
}

.dock-panel[open] summary::after{
  transform:rotate(180deg);
}

.panel-content{
  padding:12px;
  border-top:1px solid #394456;
}

/* تنظیمات ابعاد */

.dimension-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:11px;
}

.dimension-row:last-child{margin-bottom:0}

.dimension-row label{
  color:#b9c5d6;
  font-size:11px;
  min-width:48px;
}

.dimension-row input{
  width:76px;
  height:34px;
  background:#171e2a;
  color:white;
  border:1px solid #45536a;
  border-radius:6px;
  text-align:center;
  font-size:13px;
  outline:none;
}

.dimension-row input:focus{
  border-color:var(--accent);
}

.apply-button{
  width:100%;
  margin-top:13px;
  height:36px;
  background:var(--accent);
  color:#202633;
  border:0;
  font-weight:800;
  border-radius:6px;
}

.apply-button:hover{background:#e7c181}

/* رنگ‌ها */

.color-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px;
}

.color-item{
  min-width:0;
  min-height:61px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding:6px 3px;
  background:#1d2532;
  border:1px solid #3b475b;
  border-radius:7px;
  cursor:pointer;
  user-select:none;
  transition:.15s;
}

.color-item:hover{
  background:#303b4d;
  border-color:#64748b;
}

.color-item.active{
  border-color:var(--accent);
  background:#394252;
  box-shadow:inset 0 0 0 1px var(--accent);
}

.color-select{
  width:27px;
  height:27px;
  padding:0;
  border:2px solid rgba(255,255,255,.5);
  border-radius:6px;
  pointer-events:none;
}

.color-item input[type=color]{
  width:29px;
  height:27px;
  border:0;
  padding:0;
  background:transparent;
  cursor:pointer;
  border-radius:5px;
}

.color-name{
  color:#cbd4e1;
  font-size:10px;
}

/* نوار ابزار پایین موبایل و دکمه‌ها */

.export-button{
  width:100%;
  height:38px;
  background:#303b4d;
  border:1px solid #53627a;
  color:#f0f3f8;
  font-size:12px;
  font-weight:700;
}

.export-button:hover{
  border-color:var(--accent);
  color:var(--accent);
}

@media(max-width:850px){
  .main-layout{
    grid-template-columns:52px minmax(0,1fr) 260px;
  }

  .right-dock{padding:9px}
  .canvas-area{padding:10px}
}

@media(max-width:650px){
  .topbar{
    height:48px;
    padding:0 11px;
  }

  .brand{font-size:15px}

  .main-layout{
    min-height:calc(100vh - 48px);
    display:flex;
    flex-direction:column;
  }

  .left-toolbar{
    order:0;
    height:53px;
    flex-direction:row;
    justify-content:center;
    padding:5px 8px;
    border-right:0;
    border-bottom:1px solid #30394a;
    gap:5px;
  }

  .tool-button{
    width:39px;
    height:39px;
  }

  .tool-divider{
    width:1px;
    height:25px;
    margin:0 3px;
  }

  .tool-spacer{display:none}

  .center-stage{
    order:1;
    min-height:390px;
  }

  .stage-header{
    height:36px;
    padding:0 10px;
  }

  .canvas-area{
    min-height:330px;
    padding:7px;
  }

  .canvas-wrap{
    justify-content:flex-start;
    align-items:flex-start;
    padding:8px;
  }

  .stage-footer{min-height:26px}

  .right-dock{
    order:2;
    border-left:0;
    border-top:1px solid #30394a;
    padding:9px;
    overflow:visible;
  }

  .dock-heading{padding-bottom:8px}

  .dock-panel{margin-bottom:7px}

  .panel-content{padding:10px}

  .color-grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  .color-item{min-height:57px}
}

@media(max-width:380px){
  .tool-button{
    width:34px;
    height:36px;
  }

  .tool-button svg{
    width:19px;
    height:19px;
  }

  .color-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>
</head>

<body>
<div class="app">

<header class="topbar">
  <div class="topbar-right">
    <div class="brand">FABRIC <span>ANALYZER</span></div>
  </div>
  <div class="topbar-left">
    <span class="topbar-label">Workspace</span>
    <span class="save-status" id="saveStatus">✓ ذخیره شد</span>
  </div>
</header>

<div class="main-layout">

  <!-- نوار ابزار چپ -->
  <aside class="left-toolbar">

    <button class="tool-button active" id="paintTool"
      title="ابزار رنگ‌آمیزی" aria-label="ابزار رنگ‌آمیزی">
      <svg viewBox="0 0 24 24">
        <path d="m14 4 6 6"></path>
        <path d="m12 6 6 6"></path>
        <path d="m4 20 4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20Z"></path>
        <path d="M3 21h18"></path>
      </svg>
    </button>

    <div class="tool-divider"></div>

    <button class="tool-button success" id="lockBtn"
      title="قفل رنگ‌گذاری" aria-label="قفل رنگ‌گذاری">
      <svg id="lockIcon" viewBox="0 0 24 24">
        <rect x="4" y="10" width="16" height="11" rx="2"></rect>
        <path d="M8 10V7a4 4 0 0 1 7.5-2"></path>
      </svg>
    </button>

    <button class="tool-button danger" id="clearBtn"
      title="پاک کردن کامل طرح" aria-label="پاک کردن کامل طرح">
      <svg viewBox="0 0 24 24">
        <path d="M3 6h18"></path>
        <path d="M8 6V4h8v2"></path>
        <path d="M19 6l-1 14H6L5 6"></path>
        <path d="M10 11v5M14 11v5"></path>
      </svg>
    </button>

    <div class="tool-divider"></div>

    <button class="tool-button" id="undoBtn"
      title="Undo - Ctrl + Z" aria-label="Undo" disabled>
      <svg viewBox="0 0 24 24">
        <path d="M9 14 4 9l5-5"></path>
        <path d="M4 9h10a6 6 0 0 1 0 12h-2"></path>
      </svg>
    </button>

    <button class="tool-button" id="redoBtn"
      title="Redo - Ctrl + Y" aria-label="Redo" disabled>
      <svg viewBox="0 0 24 24">
        <path d="m15 14 5-5-5-5"></path>
        <path d="M20 9H10a6 6 0 0 0 0 12h2"></path>
      </svg>
    </button>

    <div class="tool-spacer"></div>

    <button class="tool-button" id="jpgBtn"
      title="ذخیره خروجی JPG" aria-label="ذخیره خروجی JPG">
      <svg viewBox="0 0 24 24">
        <path d="M12 3v12"></path>
        <path d="m7 10 5 5 5-5"></path>
        <path d="M5 19h14"></path>
      </svg>
    </button>

  </aside>

  <!-- فضای مرکزی -->
  <main class="center-stage">

    <div class="stage-header">
      <span class="stage-title">فضای طراحی</span>
      <span class="stage-hint">FABRIC CANVAS</span>
    </div>

    <div class="canvas-area">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="fabricCanvas"></canvas>
      </div>
    </div>

    <div class="stage-footer">
      <span id="canvasInfo">10 × 10</span>
      <span>Fabric Analyzer</span>
    </div>

  </main>

  <!-- پنل سمت راست -->
  <aside class="right-dock">

    <div class="dock-heading">
      <strong>Properties</strong>
      <span>تنظیمات طرح</span>
    </div>

    <details class="dock-panel" open>
      <summary>ابعاد و ساختار</summary>
      <div class="panel-content">

        <div class="dimension-row">
          <label for="cols">ستون</label>
          <input id="cols" type="number" min="1" max="40" value="10">
        </div>

        <div class="dimension-row">
          <label for="rows">ردیف</label>
          <input id="rows" type="number" min="1" max="40" value="10">
        </div>

        <div class="dimension-row">
          <label for="warps">تار</label>
          <input id="warps" type="number" min="1" max="16" value="16">
        </div>

        <div class="dimension-row">
          <label for="wefts">پود</label>
          <input id="wefts" type="number" min="1" max="16" value="3">
        </div>

        <button class="apply-button" id="applyBtn">اعمال تغییرات</button>
      </div>
    </details>

    <details class="dock-panel" open>
      <summary>رنگ‌های تار</summary>
      <div class="panel-content">
        <div class="color-grid" id="warpGrid"></div>
      </div>
    </details>

    <details class="dock-panel" open>
      <summary>رنگ‌های پود</summary>
      <div class="panel-content">
        <div class="color-grid" id="weftGrid"></div>
      </div>
    </details>

    <button class="export-button" id="exportBtn">
      ذخیره خروجی JPG
    </button>

  </aside>

</div>
</div>

<script>
const canvas=document.getElementById("fabricCanvas");
const ctx=canvas.getContext("2d");

const defaultWarpColors=[
 "#e63946","#457b9d","#2a9d8f","#e9c46a",
 "#f4a261","#9b5de5","#00b4d8","#80b918",
 "#f72585","#7209b7","#4361ee","#4d908e",
 "#f94144","#90be6d","#f8961e","#577590"
];

const defaultWeftColors=[
 "#ff3b30","#00c853","#2979ff","#ffea00",
 "#d500f9","#00b8d4","#ff9100","#8bc34a",
 "#e91e63","#795548","#607d8b","#cddc39",
 "#9c27b0","#03a9f4","#ff5722","#009688"
];

let state={
 cols:10,
 rows:10,
 warps:16,
 wefts:3,
 warpColors:[...defaultWarpColors],
 weftColors:[...defaultWeftColors],
 selectedWeft:0,
 marks:{},
 paintLocked:false
};

let CELL=48;

const LEFT=35;
const TOP=31;
const RIGHT=12;
const BOTTOM=18;
const MAX_HISTORY=100;

let undoHistory=[];
let redoHistory=[];
let colorEditSnapshot=null;
let clearArmed=false;
let clearTimer=null;

/* تاریخچه */

function makeSnapshot(){
 return JSON.parse(JSON.stringify({
  cols:state.cols,
  rows:state.rows,
  warps:state.warps,
  wefts:state.wefts,
  warpColors:state.warpColors,
  weftColors:state.weftColors,
  selectedWeft:state.selectedWeft,
  marks:state.marks
 }));
}

function snapshotsEqual(a,b){
 return JSON.stringify(a)===JSON.stringify(b);
}

function pushHistory(snapshot){
 undoHistory.push(snapshot);

 if(undoHistory.length>MAX_HISTORY){
  undoHistory.shift();
 }

 redoHistory=[];
 updateHistoryButtons();
}

function startColorEdit(){
 if(!colorEditSnapshot){
  colorEditSnapshot=makeSnapshot();
 }
}

function finishColorEdit(){
 if(!colorEditSnapshot)return;

 const before=colorEditSnapshot;
 const after=makeSnapshot();

 colorEditSnapshot=null;

 if(!snapshotsEqual(before,after)){
  pushHistory(before);
 }
}

function restoreSnapshot(snapshot){
 const locked=state.paintLocked;

 state={
  ...state,
  ...JSON.parse(JSON.stringify(snapshot)),
  paintLocked:locked
 };

 syncInputs();
 renderWarpControls();
 renderWeftControls();
 draw();
 saveState();
 updateHistoryButtons();
}

function undo(){
 finishColorEdit();

 if(!undoHistory.length)return;

 redoHistory.push(makeSnapshot());

 const previous=undoHistory.pop();
 restoreSnapshot(previous);
}

function redo(){
 finishColorEdit();

 if(!redoHistory.length)return;

 undoHistory.push(makeSnapshot());

 if(undoHistory.length>MAX_HISTORY){
  undoHistory.shift();
 }

 const next=redoHistory.pop();
 restoreSnapshot(next);
}

function updateHistoryButtons(){
 document.getElementById("undoBtn").disabled=!undoHistory.length;
 document.getElementById("redoBtn").disabled=!redoHistory.length;
}

document.getElementById("undoBtn").addEventListener("click",undo);
document.getElementById("redoBtn").addEventListener("click",redo);

/* ذخیره و بازیابی */

function saveState(){
 try{
  localStorage.setItem("fabricAnalyzerState",JSON.stringify(state));
  document.getElementById("saveStatus").textContent="✓ ذخیره شد";
 }catch(e){
  document.getElementById("saveStatus").textContent="خطا در ذخیره";
 }
}

function loadState(){
 try{
  const saved=localStorage.getItem("fabricAnalyzerState");
  if(!saved)return;

  const p=JSON.parse(saved);

  const oldWeftColors=Array.isArray(p.weftColors)
   ?p.weftColors
   :(Array.isArray(p.weftPalette)?p.weftPalette:defaultWeftColors);

  state={
   ...state,
   ...p,

   cols:Math.max(1,Math.min(40,Number(p.cols)||10)),
   rows:Math.max(1,Math.min(40,Number(p.rows)||10)),
   warps:Math.max(1,Math.min(16,Number(p.warps)||16)),
   wefts:Math.max(1,Math.min(16,Number(p.wefts)||3)),

   warpColors:Array.from({length:16},
    (_,i)=>p.warpColors?.[i]||defaultWarpColors[i]),

   weftColors:Array.from({length:16},
    (_,i)=>oldWeftColors[i]||defaultWeftColors[i]),

   selectedWeft:Math.max(0,Math.min(15,Number(p.selectedWeft)||0)),
   marks:p.marks||{},
   paintLocked:false
  };

 }catch(e){
  console.warn("Saved data could not be loaded.");
 }
}

function syncInputs(){
 document.getElementById("cols").value=state.cols;
 document.getElementById("rows").value=state.rows;
 document.getElementById("warps").value=state.warps;
 document.getElementById("wefts").value=state.wefts;
}

/* رنگ‌ها */

function renderColorItem(container,index,color,type){

 const item=document.createElement("div");
 item.className="color-item";

 if(type==="weft"&&state.selectedWeft===index){
  item.classList.add("active");
 }

 const select=document.createElement("button");
 select.className="color-select";
 select.style.background=color;
 select.title="انتخاب رنگ";

 if(type==="weft"){
  item.addEventListener("click",()=>{
   state.selectedWeft=index;
   renderWeftControls();
   saveState();
  });
 }

 const picker=document.createElement("input");
 picker.type="color";
 picker.value=color;
 picker.title="تغییر رنگ";

 picker.addEventListener("click",event=>{
  event.stopPropagation();
 });

 picker.addEventListener("pointerdown",event=>{
  event.stopPropagation();
  startColorEdit();
 });

 picker.addEventListener("focus",startColorEdit);

 picker.addEventListener("input",()=>{
  startColorEdit();

  if(type==="warp"){
   state.warpColors[index]=picker.value;
  }else{
   state.weftColors[index]=picker.value;
   select.style.background=picker.value;
  }

  draw();
  saveState();
 });

 picker.addEventListener("change",finishColorEdit);
 picker.addEventListener("blur",finishColorEdit);

 const name=document.createElement("span");
 name.className="color-name";
 name.textContent=String(index+1);

 item.append(select,picker,name);
 container.appendChild(item);
}

function renderWarpControls(){
 const box=document.getElementById("warpGrid");
 box.innerHTML="";

 for(let i=0;i<state.warps;i++){
  renderColorItem(box,i,state.warpColors[i],"warp");
 }
}

function renderWeftControls(){
 const box=document.getElementById("weftGrid");
 box.innerHTML="";

 for(let i=0;i<state.wefts;i++){
  renderColorItem(box,i,state.weftColors[i],"weft");
 }
}

/* قفل رنگ‌گذاری */

function updateLockUI(){
 const button=document.getElementById("lockBtn");
 const icon=document.getElementById("lockIcon");

 if(state.paintLocked){
  button.classList.add("active");

  icon.innerHTML=`
   <rect x="4" y="10" width="16" height="11" rx="2"></rect>
   <path d="M7 10V7a5 5 0 0 1 10 0v3"></path>
  `;

  button.title="باز کردن قفل";
  button.setAttribute("aria-label","باز کردن قفل");

 }else{
  button.classList.remove("active");

  icon.innerHTML=`
   <rect x="4" y="10" width="16" height="11" rx="2"></rect>
   <path d="M8 10V7a4 4 0 0 1 7.5-2"></path>
  `;

  button.title="قفل رنگ‌گذاری";
  button.setAttribute("aria-label","قفل رنگ‌گذاری");
 }
}

document.getElementById("lockBtn").addEventListener("click",()=>{
 state.paintLocked=!state.paintLocked;
 updateLockUI();
 saveState();
});

/* پاک کردن کامل طرح با دو مرحله */

function resetClearButton(){
 clearArmed=false;
 clearTimer=null;

 const button=document.getElementById("clearBtn");
 button.classList.remove("active");
}

document.getElementById("clearBtn").addEventListener("click",()=>{

 const button=document.getElementById("clearBtn");

 if(!clearArmed){
  clearArmed=true;
  button.classList.add("active");
  button.title="برای تأیید، دوباره کلیک کن";

  clearTimer=setTimeout(()=>{
   resetClearButton();
   button.title="پاک کردن کامل طرح";
  },5000);

  return;
 }

 clearTimeout(clearTimer);
 resetClearButton();
 button.title="پاک کردن کامل طرح";

 if(Object.keys(state.marks).length===0){
  return;
 }

 finishColorEdit();

 const before=makeSnapshot();

 state.marks={};

 pushHistory(before);
 draw();
 saveState();
});

/* رسم شبکه */

function updateCellSize(){
 CELL=window.innerWidth<=700?48:62;
}

function draw(){

 updateCellSize();

 const width=LEFT+state.cols*CELL+RIGHT;
 const height=TOP+state.rows*CELL+BOTTOM;

 const dpr=Math.max(1,window.devicePixelRatio||1);

 canvas.width=Math.round(width*dpr);
 canvas.height=Math.round(height*dpr);

 canvas.style.width=width+"px";
 canvas.style.height=height+"px";

 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.clearRect(0,0,width,height);

 ctx.fillStyle="#101b35";
 ctx.fillRect(0,0,width,height);

 ctx.fillStyle="#dce5f3";
 ctx.font="bold 11px Tahoma, Arial";
 ctx.textAlign="center";
 ctx.textBaseline="middle";

 for(let c=0;c<state.cols;c++){
  ctx.fillText(String(c+1),LEFT+c*CELL+CELL/2,15);
 }

 for(let r=0;r<state.rows;r++){
  ctx.fillText(String(r+1),17,TOP+r*CELL+CELL/2);
 }

 for(let r=0;r<state.rows;r++){
  for(let c=0;c<state.cols;c++){

   const x=LEFT+c*CELL;
   const y=TOP+r*CELL;

   ctx.fillStyle="#f8f9fc";
   ctx.fillRect(x,y,CELL,CELL);

   const partHeight=CELL/state.wefts;

   for(let k=0;k<state.wefts;k++){

    const key=`${r},${c},${k}`;
    const color=state.marks[key];

    if(color){
     ctx.fillStyle=color;

     ctx.fillRect(
      x+4,
      y+k*partHeight+2,
      CELL-8,
      Math.max(1,partHeight-4)
     );
    }
   }

   ctx.save();
   ctx.strokeStyle="rgba(0,0,0,0.42)";
   ctx.lineWidth=.8;

   for(let k=1;k<state.wefts;k++){
    const lineY=y+k*partHeight;

    ctx.beginPath();
    ctx.moveTo(x+3,lineY);
    ctx.lineTo(x+CELL-3,lineY);
    ctx.stroke();
   }

   ctx.restore();

   const warpColor=state.warpColors[c%state.warps];

   ctx.beginPath();
   ctx.roundRect(x+1,y+1,CELL-2,CELL-2,6);
   ctx.strokeStyle=warpColor;
   ctx.lineWidth=4;
   ctx.stroke();

   ctx.beginPath();
   ctx.roundRect(x+1,y+1,CELL-2,CELL-2,6);
   ctx.strokeStyle="#111827";
   ctx.lineWidth=1.4;
   ctx.stroke();
  }
 }

 document.getElementById("canvasInfo").textContent=
  `${state.cols} × ${state.rows}  |  تار ${state.warps}  |  پود ${state.wefts}`;
}

/* تشخیص خانه انتخاب‌شده */

function getCellFromPointer(event){

 const rect=canvas.getBoundingClientRect();

 const x=(event.clientX-rect.left)*
  (canvas.width/rect.width)/(window.devicePixelRatio||1)-LEFT;

 const y=(event.clientY-rect.top)*
  (canvas.height/rect.height)/(window.devicePixelRatio||1)-TOP;

 if(x<0||y<0)return null;

 const col=Math.floor(x/CELL);
 const row=Math.floor(y/CELL);

 if(col<0||col>=state.cols||row<0||row>=state.rows){
  return null;
 }

 const localY=y-row*CELL;
 const part=Math.floor(localY/(CELL/state.wefts));

 if(part<0||part>=state.wefts)return null;

 return {row,col,part};
}

/* رنگ‌آمیزی */

canvas.addEventListener("pointerdown",event=>{

 if(state.paintLocked)return;
 if(event.button!==undefined&&event.button!==0)return;

 const cell=getCellFromPointer(event);
 if(!cell)return;

 finishColorEdit();

 const before=makeSnapshot();
 const key=`${cell.row},${cell.col},${cell.part}`;
 const selectedColor=state.weftColors[state.selectedWeft];

 if(state.marks[key]===selectedColor){
  delete state.marks[key];
 }else{
  state.marks[key]=selectedColor;
 }

 pushHistory(before);
 draw();
 saveState();
});

/* اعمال تنظیمات */

document.getElementById("applyBtn")
 .addEventListener("click",applySettings);

function applySettings(){

 const cols=Number(document.getElementById("cols").value);
 const rows=Number(document.getElementById("rows").value);
 const warps=Number(document.getElementById("warps").value);
 const wefts=Number(document.getElementById("wefts").value);

 if(
  !Number.isInteger(cols)||cols<1||cols>40||
  !Number.isInteger(rows)||rows<1||rows>40||
  !Number.isInteger(warps)||warps<1||warps>16||
  !Number.isInteger(wefts)||wefts<1||wefts>16
 ){
  alert("تعداد تار و پود باید بین ۱ تا ۱۶ و ردیف و ستون بین ۱ تا ۴۰ باشد.");
  return;
 }

 finishColorEdit();

 const before=makeSnapshot();

 state.cols=cols;
 state.rows=rows;
 state.warps=warps;
 state.wefts=wefts;

 state.selectedWeft=Math.min(state.selectedWeft,wefts-1);

 for(const key of Object.keys(state.marks)){
  const [r,c,k]=key.split(",").map(Number);

  if(r>=rows||c>=cols||k>=wefts){
   delete state.marks[key];
  }
 }

 const after=makeSnapshot();

 if(!snapshotsEqual(before,after)){
  pushHistory(before);
 }

 renderWarpControls();
 renderWeftControls();
 draw();
 saveState();
}

/* خروجی JPG */

function exportJPG(){

 const link=document.createElement("a");
 link.download="Fabric-Analyzer.jpg";
 link.href=canvas.toDataURL("image/jpeg",0.98);
 link.click();
}

document.getElementById("jpgBtn").addEventListener("click",exportJPG);
document.getElementById("exportBtn").addEventListener("click",exportJPG);

/* ابزار رنگ‌آمیزی */

document.getElementById("paintTool").addEventListener("click",()=>{
 document.getElementById("paintTool").classList.add("active");
});

/* میانبرهای صفحه‌کلید */

document.addEventListener("keydown",event=>{

 const key=event.key.toLowerCase();
 const ctrl=event.ctrlKey||event.metaKey;
 const target=event.target;

 const isColorInput=
  target instanceof HTMLInputElement&&target.type==="color";

 const isEditable=
  target instanceof HTMLInputElement||
  target instanceof HTMLTextAreaElement||
  target.isContentEditable;

 if(
  event.key==="Enter"&&
  !event.shiftKey&&
  !event.altKey&&
  !isColorInput
 ){
  event.preventDefault();
  applySettings();
  return;
 }

 if(!ctrl)return;

 if(key==="s"){
  event.preventDefault();
  exportJPG();
  return;
 }

 if(key==="enter"){
  event.preventDefault();
  applySettings();
  return;
 }

 if(key==="z"&&!event.shiftKey){
  if(isEditable&&!isColorInput)return;
  event.preventDefault();
  undo();
  return;
 }

 if(key==="y"||(key==="z"&&event.shiftKey)){
  if(isEditable&&!isColorInput)return;
  event.preventDefault();
  redo();
 }
});

/* شروع برنامه */

loadState();
syncInputs();

renderWarpControls();
renderWeftControls();

updateLockUI();
updateHistoryButtons();

draw();

window.addEventListener("resize",draw);

</script>
