
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Fabric Analyzer</title>

<style>
:root{
  --bg:#10141d;
  --top:#191e29;
  --panel:#202633;
  --panel2:#282f3e;
  --panel3:#333d4f;
  --text:#edf1f8;
  --muted:#9ba8bb;
  --accent:#d8ad68;
  --border:#394456;
  --danger:#a9424b;
}

*{box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Tahoma,"Segoe UI",Arial,sans-serif;
  font-size:13px;
}

button,input{font-family:inherit}

button{
  border:1px solid var(--border);
  background:var(--panel2);
  color:var(--text);
  border-radius:7px;
  cursor:pointer;
  transition:.15s;
}

button:hover{background:var(--panel3)}
button:active{transform:scale(.97)}
button:disabled{opacity:.3;cursor:not-allowed;transform:none}

.app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* TOP BAR */

.topbar{
  height:48px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:var(--top);
  border-bottom:1px solid #30394a;
}

.brand{
  font-size:16px;
  font-weight:800;
  letter-spacing:.5px;
  white-space:nowrap;
}

.brand span{color:var(--accent)}

.topbar-right,.topbar-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.save-status{
  color:#8fc9a8;
  font-size:11px;
}

.topbar-label{
  color:var(--muted);
  font-size:11px;
}

/* MENUBAR */

.menubar{
  height:35px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:2px;
  padding:0 10px;
  background:#202633;
  border-bottom:1px solid #394456;
  position:relative;
  z-index:20;
}

.menu-group{position:relative;height:100%}

.menu-trigger{
  height:100%;
  padding:0 12px;
  border:0;
  border-radius:0;
  background:transparent;
  color:#d6deea;
  font-size:12px;
  white-space:nowrap;
}

.menu-trigger:hover,
.menu-group.open .menu-trigger{
  background:#354052;
  color:white;
}

.dropdown{
  display:none;
  position:absolute;
  top:calc(100% + 1px);
  right:0;
  width:225px;
  padding:5px;
  background:#252d3b;
  border:1px solid #46536a;
  border-radius:7px;
  box-shadow:0 12px 30px rgba(0,0,0,.4);
  z-index:50;
}

.menu-group.open .dropdown{display:block}

.menu-item{
  width:100%;
  min-height:34px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:0 10px;
  border:0;
  background:transparent;
  border-radius:5px;
  color:#e5eaf2;
  text-align:right;
  font-size:11px;
}

.menu-item:hover{
  background:#39465a;
  color:white;
}

.menu-item:disabled{opacity:.35}

.menu-shortcut{
  color:#9ba8bb;
  font-size:10px;
  direction:ltr;
  white-space:nowrap;
}

.menu-separator{
  height:1px;
  background:#414d60;
  margin:5px 4px;
}

.menu-item.danger-item{color:#f09ba4}

.menu-check{
  color:var(--accent);
  font-weight:bold;
}

/* MAIN LAYOUT */

.main-layout{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:58px minmax(0,1fr) 300px;
  direction:ltr;
  overflow:hidden;
}

/* TOOLBAR */

.left-toolbar{
  min-height:0;
  background:var(--top);
  border-right:1px solid #30394a;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  padding:12px 7px;
  direction:rtl;
  overflow:hidden;
}

.tool-button{
  width:42px;
  height:42px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid transparent;
  background:transparent;
  color:#b8c3d3;
  border-radius:8px;
  padding:0;
}

.tool-button:hover{
  background:#30394a;
  color:white;
}

.tool-button.active{
  background:#3c4657;
  border-color:var(--accent);
  color:var(--accent);
}

.tool-button svg{
  width:21px;
  height:21px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.tool-divider{
  width:28px;
  height:1px;
  flex-shrink:0;
  background:#3a4557;
  margin:5px 0;
}

.tool-spacer{flex:1}

.tool-button.danger{color:#e58c98}
.tool-button.success{color:#9ed9bb}

/* CENTER */

.center-stage{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:#111722;
  direction:rtl;
  overflow:hidden;
}

.stage-header{
  height:39px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  background:#1b2230;
  border-bottom:1px solid #30394a;
}

.stage-title{
  color:#c7d1df;
  font-size:12px;
  font-weight:700;
}

.stage-hint{
  color:#8492a7;
  font-size:10px;
}

.canvas-area{
  flex:1;
  min-height:0;
  min-width:0;
  padding:12px;
  display:flex;
  overflow:hidden;
  background-color:#101b35;
  background-image:
    radial-gradient(rgba(255,255,255,.035) .7px,transparent .7px);
  background-size:18px 18px;
}

.canvas-wrap{
  flex:1;
  min-width:0;
  min-height:0;
  overflow:auto;
  direction:ltr;
  display:flex;
  align-items:flex-start;
  justify-content:flex-start;
  background:#101b35;
  border:1px solid #34445f;
  border-radius:8px;
  padding:12px;
  touch-action:pan-x pan-y;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  scrollbar-width:thin;
  scrollbar-color:#53627a #172239;
}

.canvas-wrap canvas{
  display:block;
  flex-shrink:0;
  max-width:none;
  height:auto;
  cursor:crosshair;
  touch-action:pan-x pan-y;
  margin:auto;
}

.stage-footer{
  min-height:29px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:4px 14px;
  background:#1b2230;
  border-top:1px solid #30394a;
  color:#8592a5;
  font-size:10px;
}

.zoom-controls{
  display:flex;
  align-items:center;
  gap:5px;
  direction:ltr;
}

.zoom-button{
  width:23px;
  height:22px;
  padding:0;
  font-size:14px;
  line-height:1;
}

.zoom-value{
  min-width:42px;
  text-align:center;
  color:#c6d0df;
  font-size:10px;
}

/* RIGHT DOCK */

.right-dock{
  min-width:0;
  min-height:0;
  background:var(--panel);
  border-left:1px solid #30394a;
  direction:rtl;
  overflow-y:auto;
  overflow-x:hidden;
  padding:12px;
  scrollbar-width:thin;
  scrollbar-color:#53627a #202633;
}

.dock-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:3px 3px 12px;
  margin-bottom:10px;
  border-bottom:1px solid var(--border);
}

.dock-heading strong{
  font-size:13px;
  color:#e9eef7;
}

.dock-heading span{
  color:var(--muted);
  font-size:10px;
}

.dock-panel{
  background:#252d3b;
  border:1px solid #394456;
  border-radius:9px;
  margin-bottom:10px;
  overflow:hidden;
}

.dock-panel summary{
  height:42px;
  padding:0 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
  list-style:none;
  user-select:none;
  color:#e5eaf2;
  font-size:12px;
  font-weight:700;
}

.dock-panel summary::-webkit-details-marker{display:none}

.dock-panel summary::after{
  content:"⌄";
  color:var(--accent);
  font-size:18px;
  transition:transform .15s;
}

.dock-panel[open] summary::after{
  transform:rotate(180deg);
}

.panel-content{
  padding:12px;
  border-top:1px solid #394456;
}

/* DIMENSIONS */

.dimension-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:11px;
}

.dimension-row:last-child{margin-bottom:0}

.dimension-row label{
  color:#b9c5d6;
  font-size:11px;
  min-width:48px;
}

.dimension-row input{
  width:76px;
  height:34px;
  background:#171e2a;
  color:white;
  border:1px solid #45536a;
  border-radius:6px;
  text-align:center;
  font-size:13px;
  outline:none;
}

.dimension-row input:focus{border-color:var(--accent)}

.apply-button{
  width:100%;
  margin-top:13px;
  height:36px;
  background:var(--accent);
  color:#202633;
  border:0;
  font-weight:800;
  border-radius:6px;
}

.apply-button:hover{background:#e7c181}

/* COLORS */

.color-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px;
}

.color-item{
  min-width:0;
  min-height:61px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding:6px 3px;
  background:#1d2532;
  border:1px solid #3b475b;
  border-radius:7px;
  cursor:pointer;
  user-select:none;
  transition:.15s;
}

.color-item:hover{
  background:#303b4d;
  border-color:#64748b;
}

.color-item.active{
  border-color:var(--accent);
  background:#394252;
  box-shadow:inset 0 0 0 1px var(--accent);
}

.color-select{
  width:27px;
  height:27px;
  padding:0;
  border:2px solid rgba(255,255,255,.5);
  border-radius:6px;
  pointer-events:none;
}

.color-item input[type=color]{
  width:29px;
  height:27px;
  border:0;
  padding:0;
  background:transparent;
  cursor:pointer;
  border-radius:5px;
}

.color-name{
  color:#cbd4e1;
  font-size:10px;
}

.export-button{
  width:100%;
  height:38px;
  background:#303b4d;
  border:1px solid #53627a;
  color:#f0f3f8;
  font-size:12px;
  font-weight:700;
}

.export-button:hover{
  border-color:var(--accent);
  color:var(--accent);
}

/* HIDDEN PANELS */

.main-layout.hide-toolbar{
  grid-template-columns:minmax(0,1fr) 300px;
}

.main-layout.hide-toolbar .left-toolbar{display:none}

.main-layout.hide-dock{
  grid-template-columns:58px minmax(0,1fr);
}

.main-layout.hide-dock .right-dock{display:none}

.main-layout.hide-toolbar.hide-dock{
  grid-template-columns:minmax(0,1fr);
}

/* HELP DIALOG */

.dialog-backdrop{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.65);
  align-items:center;
  justify-content:center;
  padding:18px;
}

.dialog-backdrop.show{display:flex}

.dialog{
  width:min(440px,100%);
  max-height:85dvh;
  overflow:auto;
  background:#252d3b;
  border:1px solid #4a5870;
  border-radius:12px;
  padding:18px;
  box-shadow:0 20px 60px #0008;
}

.dialog h3{
  margin:0 0 15px;
  color:var(--accent);
}

.shortcut-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:9px 2px;
  border-bottom:1px solid #394456;
  font-size:12px;
}

.shortcut-row span:last-child{
  color:#c6d0df;
  direction:ltr;
}

.dialog-close{
  width:100%;
  height:36px;
  margin-top:15px;
}

/* RESPONSIVE */

@media(max-width:850px){
  .main-layout{
    grid-template-columns:52px minmax(0,1fr) 260px;
  }

  .right-dock{padding:9px}
  .canvas-area{padding:8px}
}

@media(max-width:650px){

  .topbar{
    height:44px;
    padding:0 10px;
  }

  .brand{font-size:14px}
  .topbar-label{display:none}

  .menubar{
    height:34px;
    padding:0 5px;
    overflow-x:auto;
    overflow-y:visible;
    scrollbar-width:none;
    flex-shrink:0;
  }

  .menubar::-webkit-scrollbar{display:none}

  .menu-trigger{
    padding:0 9px;
    font-size:11px;
  }

  .dropdown{
    position:fixed;
    top:82px;
    right:5px;
    width:220px;
  }

  .main-layout{
    display:flex;
    flex:1;
    min-height:0;
    flex-direction:column;
    overflow:hidden;
  }

  .left-toolbar{
    order:0;
    height:49px;
    min-height:49px;
    flex-shrink:0;
    flex-direction:row;
    justify-content:center;
    padding:4px 6px;
    border-right:0;
    border-bottom:1px solid #30394a;
    gap:4px;
  }

  .tool-button{
    width:37px;
    height:37px;
  }

  .tool-divider{
    width:1px;
    height:24px;
    margin:0 3px;
  }

  .tool-spacer{display:none}

  .center-stage{
    order:1;
    flex:1;
    min-height:0;
    overflow:hidden;
  }

  .stage-header{
    height:33px;
    min-height:33px;
    padding:0 9px;
  }

  .canvas-area{
    flex:1;
    min-height:0;
    padding:6px;
    overflow:hidden;
  }

  .canvas-wrap{
    width:100%;
    height:100%;
    min-height:0;
    padding:8px;
    justify-content:flex-start;
    align-items:flex-start;
  }

  .stage-footer{
    min-height:28px;
    padding:3px 8px;
  }

  .right-dock{
    order:2;
    flex:0 0 auto;
    height:27dvh;
    max-height:27dvh;
    min-height:105px;
    border-left:0;
    border-top:1px solid #30394a;
    padding:7px;
    overflow-y:auto;
    overscroll-behavior:contain;
  }

  .dock-heading{
    padding:2px 3px 7px;
    margin-bottom:7px;
  }

  .dock-panel{margin-bottom:6px}
  .dock-panel summary{height:36px}
  .panel-content{padding:8px}

  .color-grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  .color-item{min-height:53px}
  .dimension-row{margin-bottom:7px}
  .dimension-row input{height:31px}
  .apply-button{margin-top:8px;height:33px}

  .main-layout.hide-toolbar{
    display:flex;
  }

  .main-layout.hide-toolbar .center-stage{order:0}

  .main-layout.hide-dock{
    display:flex;
  }

  .main-layout.hide-dock .center-stage{order:1}
}

@media(max-width:380px){
  .tool-button{
    width:33px;
    height:35px;
  }

  .tool-button svg{
    width:19px;
    height:19px;
  }

  .color-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>
</head>

<body>
<div class="app">

<header class="topbar">
  <div class="topbar-right">
    <div class="brand">FABRIC <span>ANALYZER</span></div>
  </div>
  <div class="topbar-left">
    <span class="topbar-label">Workspace</span>
    <span class="save-status" id="saveStatus">✓ ذخیره شد</span>
  </div>
</header>

<!-- MENU BAR -->
<nav class="menubar" id="menubar">

  <div class="menu-group">
    <button class="menu-trigger">فایل</button>
    <div class="dropdown">
      <button class="menu-item" data-action="save-project">
        <span>ذخیره پروژه</span><span class="menu-shortcut">Ctrl + S</span>
      </button>
      <button class="menu-item" data-action="open-project">
        <span>باز کردن پروژه</span><span class="menu-shortcut">JSON</span>
      </button>
      <div class="menu-separator"></div>
      <button class="menu-item" data-action="export-jpg">
        <span>خروجی تصویر JPG</span><span class="menu-shortcut">JPG</span>
      </button>
      <button class="menu-item" data-action="export-png">
        <span>خروجی تصویر PNG</span><span class="menu-shortcut">PNG</span>
      </button>
    </div>
  </div>

  <div class="menu-group">
    <button class="menu-trigger">ویرایش</button>
    <div class="dropdown">
      <button class="menu-item" data-action="undo">
        <span>بازگشت</span><span class="menu-shortcut">Ctrl + Z</span>
      </button>
      <button class="menu-item" data-action="redo">
        <span>انجام دوباره</span><span class="menu-shortcut">Ctrl + Y</span>
      </button>
      <div class="menu-separator"></div>
      <button class="menu-item danger-item" data-action="clear">
        <span>پاک کردن کامل طرح</span><span class="menu-shortcut">—</span>
      </button>
    </div>
  </div>

  <div class="menu-group">
    <button class="menu-trigger">تصویر</button>
    <div class="dropdown">
      <button class="menu-item" data-action="apply">
        <span>اعمال ابعاد جدید</span><span class="menu-shortcut">Enter</span>
      </button>
      <button class="menu-item" data-action="clear-marks">
        <span>پاک کردن رنگ‌های بوم</span>
      </button>
    </div>
  </div>

  <div class="menu-group">
    <button class="menu-trigger">بافت</button>
    <div class="dropdown">
      <button class="menu-item" data-action="warp-panel">
        <span>رفتن به رنگ‌های تار</span>
      </button>
      <button class="menu-item" data-action="weft-panel">
        <span>رفتن به رنگ‌های پود</span>
      </button>
      <button class="menu-item" data-action="dimensions-panel">
        <span>تنظیمات ابعاد</span>
      </button>
    </div>
  </div>

  <div class="menu-group">
    <button class="menu-trigger">انتخاب</button>
    <div class="dropdown">
      <button class="menu-item" data-action="next-color">
        <span>رنگ پود بعدی</span>
      </button>
      <button class="menu-item" data-action="previous-color">
        <span>رنگ پود قبلی</span>
      </button>
    </div>
  </div>

  <div class="menu-group">
    <button class="menu-trigger">نمایش</button>
    <div class="dropdown">
      <button class="menu-item" data-action="zoom-in">
        <span>بزرگ‌نمایی</span><span class="menu-shortcut">+</span>
      </button>
      <button class="menu-item" data-action="zoom-out">
        <span>کوچک‌نمایی</span><span class="menu-shortcut">−</span>
      </button>
      <button class="menu-item" data-action="zoom-reset">
        <span>اندازه واقعی</span><span class="menu-shortcut">100%</span>
      </button>
      <div class="menu-separator"></div>
      <button class="menu-item" data-action="toggle-toolbar">
        <span>نمایش / مخفی ابزارها</span><span class="menu-shortcut">✓</span>
      </button>
      <button class="menu-item" data-action="toggle-dock">
        <span>نمایش / مخفی Properties</span><span class="menu-shortcut">✓</span>
      </button>
    </div>
  </div>

  <div class="menu-group">
    <button class="menu-trigger">پنجره</button>
    <div class="dropdown">
      <button class="menu-item" data-action="show-all">
        <span>نمایش همه پنل‌ها</span>
      </button>
      <button class="menu-item" data-action="toggle-lock">
        <span>قفل رنگ‌گذاری</span>
      </button>
    </div>
  </div>

  <div class="menu-group">
    <button class="menu-trigger">راهنما</button>
    <div class="dropdown">
      <button class="menu-item" data-action="help">
        <span>میانبرهای صفحه‌کلید</span>
      </button>
      <button class="menu-item" data-action="about">
        <span>درباره Fabric Analyzer</span>
      </button>
    </div>
  </div>

</nav>

<div class="main-layout" id="mainLayout">

  <!-- TOOLBAR -->
  <aside class="left-toolbar">

    <button class="tool-button active" id="paintTool" title="ابزار رنگ‌آمیزی">
      <svg viewBox="0 0 24 24">
        <path d="m14 4 6 6"></path>
        <path d="m12 6 6 6"></path>
        <path d="m4 20 4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20Z"></path>
        <path d="M3 21h18"></path>
      </svg>
    </button>

    <div class="tool-divider"></div>

    <button class="tool-button success" id="lockBtn" title="قفل رنگ‌گذاری">
      <svg id="lockIcon" viewBox="0 0 24 24">
        <rect x="4" y="10" width="16" height="11" rx="2"></rect>
        <path d="M8 10V7a4 4 0 0 1 7.5-2"></path>
      </svg>
    </button>

<script>
const canvas=document.getElementById("fabricCanvas");
const ctx=canvas.getContext("2d");
const canvasWrap=document.getElementById("canvasWrap");

const defaultWarpColors=[
 "#e63946","#457b9d","#2a9d8f","#e9c46a",
 "#f4a261","#9b5de5","#00b4d8","#80b918",
 "#f72585","#7209b7","#4361ee","#4d908e",
 "#f94144","#90be6d","#f8961e","#577590"
];

const defaultWeftColors=[
 "#ff3b30","#00c853","#2979ff","#ffea00",
 "#d500f9","#00b8d4","#ff9100","#8bc34a",
 "#e91e63","#795548","#607d8b","#cddc39",
 "#9c27b0","#03a9f4","#ff5722","#009688"
];

let state={
 cols:10,
 rows:10,
 warps:16,
 wefts:3,
 warpColors:[...defaultWarpColors],
 weftColors:[...defaultWeftColors],
 selectedWeft:0,
 marks:{},
 paintLocked:false
};

let CELL=48;
let zoom=1;

const LEFT=35;
const TOP=31;
const RIGHT=12;
const BOTTOM=18;
const MAX_HISTORY=100;

let undoHistory=[];
let redoHistory=[];
let colorEditSnapshot=null;
let clearArmed=false;
let clearTimer=null;

/* HISTORY */

function makeSnapshot(){
 return JSON.parse(JSON.stringify({
  cols:state.cols,
  rows:state.rows,
  warps:state.warps,
  wefts:state.wefts,
  warpColors:state.warpColors,
  weftColors:state.weftColors,
  selectedWeft:state.selectedWeft,
  marks:state.marks
 }));
}

function snapshotsEqual(a,b){
 return JSON.stringify(a)===JSON.stringify(b);
}

function pushHistory(snapshot){
 undoHistory.push(snapshot);

 if(undoHistory.length>MAX_HISTORY)undoHistory.shift();

 redoHistory=[];
 updateHistoryButtons();
}

function startColorEdit(){
 if(!colorEditSnapshot)colorEditSnapshot=makeSnapshot();
}

function finishColorEdit(){
 if(!colorEditSnapshot)return;

 const before=colorEditSnapshot;
 const after=makeSnapshot();

 colorEditSnapshot=null;

 if(!snapshotsEqual(before,after))pushHistory(before);
}

function restoreSnapshot(snapshot){
 const locked=state.paintLocked;

 state={
  ...state,
  ...JSON.parse(JSON.stringify(snapshot)),
  paintLocked:locked
 };

 syncInputs();
 renderWarpControls();
 renderWeftControls();
 draw();
 saveState();
 updateHistoryButtons();
}

function undo(){
 finishColorEdit();
 if(!undoHistory.length)return;

 redoHistory.push(makeSnapshot());
 restoreSnapshot(undoHistory.pop());
}

function redo(){
 finishColorEdit();
 if(!redoHistory.length)return;

 undoHistory.push(makeSnapshot());

 if(undoHistory.length>MAX_HISTORY)undoHistory.shift();

 restoreSnapshot(redoHistory.pop());
}

function updateHistoryButtons(){
 document.getElementById("undoBtn").disabled=!undoHistory.length;
 document.getElementById("redoBtn").disabled=!redoHistory.length;
}

document.getElementById("undoBtn").addEventListener("click",undo);
document.getElementById("redoBtn").addEventListener("click",redo);

/* STORAGE */

function saveState(){
 try{
  localStorage.setItem("fabricAnalyzerState",JSON.stringify(state));
  document.getElementById("saveStatus").textContent="✓ ذخیره شد";
 }catch(e){
  document.getElementById("saveStatus").textContent="خطا در ذخیره";
 }
}

function loadState(){
 try{
  const saved=localStorage.getItem("fabricAnalyzerState");
  if(!saved)return;

  const p=JSON.parse(saved);

  const oldWeftColors=Array.isArray(p.weftColors)
   ?p.weftColors
   :(Array.isArray(p.weftPalette)?p.weftPalette:defaultWeftColors);

  state={
   ...state,
   ...p,

   cols:Math.max(1,Math.min(40,Number(p.cols)||10)),
   rows:Math.max(1,Math.min(40,Number(p.rows)||10)),
   warps:Math.max(1,Math.min(16,Number(p.warps)||16)),
   wefts:Math.max(1,Math.min(16,Number(p.wefts)||3)),

   warpColors:Array.from({length:16},
    (_,i)=>p.warpColors?.[i]||defaultWarpColors[i]),

   weftColors:Array.from({length:16},
    (_,i)=>oldWeftColors[i]||defaultWeftColors[i]),

   selectedWeft:Math.max(0,Math.min(15,Number(p.selectedWeft)||0)),
   marks:p.marks||{},
   paintLocked:false
  };

 }catch(e){
  console.warn("Saved data could not be loaded.");
 }
}

function syncInputs(){
 document.getElementById("cols").value=state.cols;
 document.getElementById("rows").value=state.rows;
 document.getElementById("warps").value=state.warps;
 document.getElementById("wefts").value=state.wefts;
}

/* COLOR CONTROLS */

function renderColorItem(container,index,color,type){

 const item=document.createElement("div");
 item.className="color-item";

 if(type==="weft"&&state.selectedWeft===index)item.classList.add("active");

 const select=document.createElement("button");
 select.className="color-select";
 select.style.background=color;
 select.title="انتخاب رنگ";

 if(type==="weft"){
  item.addEventListener("click",()=>{
   state.selectedWeft=index;
   renderWeftControls();
   saveState();
  });
 }

 const picker=document.createElement("input");
 picker.type="color";
 picker.value=color;
 picker.title="تغییر رنگ";

 picker.addEventListener("click",event=>event.stopPropagation());

 picker.addEventListener("pointerdown",event=>{
  event.stopPropagation();
  startColorEdit();
 });

 picker.addEventListener("focus",startColorEdit);

 picker.addEventListener("input",()=>{
  startColorEdit();

  if(type==="warp"){
   state.warpColors[index]=picker.value;
  }else{
   state.weftColors[index]=picker.value;
   select.style.background=picker.value;
  }

  draw();
  saveState();
 });

 picker.addEventListener("change",finishColorEdit);
 picker.addEventListener("blur",finishColorEdit);

 const name=document.createElement("span");
 name.className="color-name";
 name.textContent=String(index+1);

 item.append(select,picker,name);
 container.appendChild(item);
}

function renderWarpControls(){
 const box=document.getElementById("warpGrid");
 box.innerHTML="";

 for(let i=0;i<state.warps;i++){
  renderColorItem(box,i,state.warpColors[i],"warp");
 }
}

function renderWeftControls(){
 const box=document.getElementById("weftGrid");
 box.innerHTML="";

 for(let i=0;i<state.wefts;i++){
  renderColorItem(box,i,state.weftColors[i],"weft");
 }
}

/* LOCK */

function updateLockUI(){
 const button=document.getElementById("lockBtn");
 const icon=document.getElementById("lockIcon");

 if(state.paintLocked){
  button.classList.add("active");

  icon.innerHTML=`
   <rect x="4" y="10" width="16" height="11" rx="2"></rect>
   <path d="M7 10V7a5 5 0 0 1 10 0v3"></path>
  `;

  button.title="باز کردن قفل";
 }else{
  button.classList.remove("active");

  icon.innerHTML=`
   <rect x="4" y="10" width="16" height="11" rx="2"></rect>
   <path d="M8 10V7a4 4 0 0 1 7.5-2"></path>
  `;

  button.title="قفل رنگ‌گذاری";
 }
}

function toggleLock(){
 state.paintLocked=!state.paintLocked;
 updateLockUI();
 saveState();
}

document.getElementById("lockBtn").addEventListener("click",toggleLock);

/* CLEAR */

function resetClearButton(){
 clearArmed=false;
 clearTimer=null;

 const button=document.getElementById("clearBtn");
 button.classList.remove("active");
}

function clearDesign(){
 finishColorEdit();

 if(Object.keys(state.marks).length===0)return;

 const before=makeSnapshot();
 state.marks={};

 pushHistory(before);
 draw();
 saveState();
}

document.getElementById("clearBtn").addEventListener("click",()=>{

 const button=document.getElementById("clearBtn");

 if(!clearArmed){
  clearArmed=true;
  button.classList.add("active");
  button.title="برای تأیید، دوباره کلیک کن";

  clearTimer=setTimeout(()=>{
   resetClearButton();
   button.title="پاک کردن کامل طرح";
  },5000);

  return;
 }

 clearTimeout(clearTimer);
 resetClearButton();
 button.title="پاک کردن کامل طرح";
 clearDesign();
});

/* DRAW */

function updateCellSize(){
 CELL=window.innerWidth<=700?48:62;
}

function draw(){

 updateCellSize();

 const width=LEFT+state.cols*CELL+RIGHT;
 const height=TOP+state.rows*CELL+BOTTOM;

 const dpr=Math.max(1,window.devicePixelRatio||1);

 canvas.width=Math.round(width*dpr);
 canvas.height=Math.round(height*dpr);

 canvas.style.width=(width*zoom)+"px";
 canvas.style.height=(height*zoom)+"px";

 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.clearRect(0,0,width,height);

 ctx.fillStyle="#101b35";
 ctx.fillRect(0,0,width,height);

 ctx.fillStyle="#dce5f3";
 ctx.font="bold 11px Tahoma, Arial";
 ctx.textAlign="center";
 ctx.textBaseline="middle";

 for(let c=0;c<state.cols;c++){
  ctx.fillText(String(c+1),LEFT+c*CELL+CELL/2,15);
 }

 for(let r=0;r<state.rows;r++){
  ctx.fillText(String(r+1),17,TOP+r*CELL+CELL/2);
 }

 for(let r=0;r<state.rows;r++){
  for(let c=0;c<state.cols;c++){

   const x=LEFT+c*CELL;
   const y=TOP+r*CELL;

   ctx.fillStyle="#f8f9fc";
   ctx.fillRect(x,y,CELL,CELL);

   const partHeight=CELL/state.wefts;

   for(let k=0;k<state.wefts;k++){

    const key=`${r},${c},${k}`;
    const color=state.marks[key];

    if(color){
     ctx.fillStyle=color;

     ctx.fillRect(
      x+4,
      y+k*partHeight+2,
      CELL-8,
      Math.max(1,partHeight-4)
     );
    }
   }

   ctx.save();
   ctx.strokeStyle="rgba(0,0,0,0.42)";
   ctx.lineWidth=.8;

   for(let k=1;k<state.wefts;k++){
    const lineY=y+k*partHeight;

    ctx.beginPath();
    ctx.moveTo(x+3,lineY);
    ctx.lineTo(x+CELL-3,lineY);
    ctx.stroke();
   }

   ctx.restore();

   const warpColor=state.warpColors[c%state.warps];

   ctx.beginPath();
   ctx.roundRect(x+1,y+1,CELL-2,CELL-2,6);
   ctx.strokeStyle=warpColor;
   ctx.lineWidth=4;
   ctx.stroke();

   ctx.beginPath();
   ctx.roundRect(x+1,y+1,CELL-2,CELL-2,6);
   ctx.strokeStyle="#111827";
   ctx.lineWidth=1.4;
   ctx.stroke();
  }
 }

 document.getElementById("canvasInfo").textContent=
  `${state.cols} × ${state.rows}  |  تار ${state.warps}  |  پود ${state.wefts}`;

 document.getElementById("zoomValue").textContent=Math.round(zoom*100)+"%";
}

/* POINTER */

function getCellFromPointer(event){

 const rect=canvas.getBoundingClientRect();

 const x=(event.clientX-rect.left)*
  (canvas.width/rect.width)/(window.devicePixelRatio||1)-LEFT;

 const y=(event.clientY-rect.top)*
  (canvas.height/rect.height)/(window.devicePixelRatio||1)-TOP;

 if(x<0||y<0)return null;

 const col=Math.floor(x/CELL);
 const row=Math.floor(y/CELL);

 if(col<0||col>=state.cols||row<0||row>=state.rows)return null;

 const localY=y-row*CELL;
 const part=Math.floor(localY/(CELL/state.wefts));

 if(part<0||part>=state.wefts)return null;

 return {row,col,part};
}

/* PAINT */

canvas.addEventListener("pointerdown",event=>{

 if(state.paintLocked)return;
 if(event.button!==undefined&&event.button!==0)return;

 const cell=getCellFromPointer(event);
 if(!cell)return;

 finishColorEdit();

 const before=makeSnapshot();
 const key=`${cell.row},${cell.col},${cell.part}`;
 const selectedColor=state.weftColors[state.selectedWeft];

 if(state.marks[key]===selectedColor){
  delete state.marks[key];
 }else{
  state.marks[key]=selectedColor;
 }

 pushHistory(before);
 draw();
 saveState();
});

/* APPLY SETTINGS */

document.getElementById("applyBtn").addEventListener("click",applySettings);

function applySettings(){

 const cols=Number(document.getElementById("cols").value);
 const rows=Number(document.getElementById("rows").value);
 const warps=Number(document.getElementById("warps").value);
 const wefts=Number(document.getElementById("wefts").value);

 if(
  !Number.isInteger(cols)||cols<1||cols>40||
  !Number.isInteger(rows)||rows<1||rows>40||
  !Number.isInteger(warps)||warps<1||warps>16||
  !Number.isInteger(wefts)||wefts<1||wefts>16
 ){
  alert("تعداد تار و پود باید بین ۱ تا ۱۶ و ردیف و ستون بین ۱ تا ۴۰ باشد.");
  return;
 }

 finishColorEdit();

 const before=makeSnapshot();

 state.cols=cols;
 state.rows=rows;
 state.warps=warps;
 state.wefts=wefts;

 state.selectedWeft=Math.min(state.selectedWeft,wefts-1);

 for(const key of Object.keys(state.marks)){
  const [r,c,k]=key.split(",").map(Number);

  if(r>=rows||c>=cols||k>=wefts)delete state.marks[key];
 }

 const after=makeSnapshot();

 if(!snapshotsEqual(before,after))pushHistory(before);

 renderWarpControls();
 renderWeftControls();
 draw();
 saveState();
}

/* EXPORT */

function downloadCanvas(type){
 const link=document.createElement("a");
 const extension=type==="image/png"?"png":"jpg";
 link.download="Fabric-Analyzer."+extension;
 link.href=canvas.toDataURL(type,type==="image/jpeg"?.98:undefined);
 link.click();
}

function exportJPG(){downloadCanvas("image/jpeg")}
function exportPNG(){downloadCanvas("image/png")}

document.getElementById("jpgBtn").addEventListener("click",exportJPG);
document.getElementById("exportBtn").addEventListener("click",exportJPG);

/* PROJECT SAVE / LOAD */

function saveProject(){
 finishColorEdit();

 const project={
  app:"Fabric Analyzer",
  version:1,
  savedAt:new Date().toISOString(),
  state:makeSnapshot()
 };

 const blob=new Blob([JSON.stringify(project,null,2)],{
  type:"application/json"
 });

 const url=URL.createObjectURL(blob);
 const link=document.createElement("a");

 link.href=url;
 link.download="Fabric-Analyzer-Project.json";
 link.click();

 URL.revokeObjectURL(url);
}

function openProject(){
 document.getElementById("projectInput").click();
}

document.getElementById("projectInput").addEventListener("change",event=>{

 const file=event.target.files[0];
 if(!file)return;

 const reader=new FileReader();

 reader.onload=()=>{
  try{
   const parsed=JSON.parse(reader.result);
   const p=parsed.state||parsed;

   if(
    !p||
    !Number.isInteger(Number(p.cols))||
    !Number.isInteger(Number(p.rows))||
    !Number.isInteger(Number(p.warps))||
    !Number.isInteger(Number(p.wefts))
   ){
    throw new Error("Invalid project");
   }

   const before=makeSnapshot();

   state={
    ...state,
    ...p,
    cols:Math.max(1,Math.min(40,Number(p.cols))),
    rows:Math.max(1,Math.min(40,Number(p.rows))),
    warps:Math.max(1,Math.min(16,Number(p.warps))),
    wefts:Math.max(1,Math.min(16,Number(p.wefts))),
    warpColors:Array.from({length:16},(_,i)=>p.warpColors?.[i]||defaultWarpColors[i]),
    weftColors:Array.from({length:16},(_,i)=>p.weftColors?.[i]||defaultWeftColors[i]),
    marks:p.marks||{},
    selectedWeft:Math.max(0,Math.min(15,Number(p.selectedWeft)||0)),
    paintLocked:false
   };

   pushHistory(before);
   syncInputs();
   renderWarpControls();
   renderWeftControls();
   updateLockUI();
   draw();
   saveState();

  }catch(error){
   alert("فایل پروژه معتبر نیست یا قابل خواندن نیست.");
  }

  event.target.value="";
 };

 reader.readAsText(file);
});

/* ZOOM */

function setZoom(value){
 zoom=Math.max(.25,Math.min(3,value));
 draw();
}

function zoomIn(){setZoom(zoom+.1)}
function zoomOut(){setZoom(zoom-.1)}
function zoomReset(){setZoom(1)}

document.getElementById("zoomInBtn").addEventListener("click",zoomIn);
document.getElementById("zoomOutBtn").addEventListener("click",zoomOut);
document.getElementById("zoomResetBtn").addEventListener("click",zoomReset);

/* PANELS */

const mainLayout=document.getElementById("mainLayout");

function toggleToolbar(){
 mainLayout.classList.toggle("hide-toolbar");
}

function toggleDock(){
 mainLayout.classList.toggle("hide-dock");
}

function showAllPanels(){
 mainLayout.classList.remove("hide-toolbar","hide-dock");
}

function openPanel(id){
 const panel=document.getElementById(id);
 if(!panel)return;

 panel.open=true;
 panel.scrollIntoView({behavior:"smooth",block:"nearest"});
}

/* MENU ACTIONS */

function runAction(action){

 switch(action){

  case "save-project":saveProject();break;
  case "open-project":openProject();break;
  case "export-jpg":exportJPG();break;
  case "export-png":exportPNG();break;

  case "undo":undo();break;
  case "redo":redo();break;
  case "clear":document.getElementById("clearBtn").click();break;

  case "apply":applySettings();break;
  case "clear-marks":clearDesign();break;

  case "warp-panel":
   showAllPanels();
   openPanel("warpPanel");
   break;

  case "weft-panel":
   showAllPanels();
   openPanel("weftPanel");
   break;

  case "dimensions-panel":
   showAllPanels();
   openPanel("dimensionsPanel");
   break;

  case "next-color":
   state.selectedWeft=(state.selectedWeft+1)%state.wefts;
   renderWeftControls();
   saveState();
   break;

  case "previous-color":
   state.selectedWeft=(state.selectedWeft-1+state.wefts)%state.wefts;
   renderWeftControls();
   saveState();
   break;

  case "zoom-in":zoomIn();break;
  case "zoom-out":zoomOut();break;
  case "zoom-reset":zoomReset();break;

  case "toggle-toolbar":toggleToolbar();break;
  case "toggle-dock":toggleDock();break;
  case "show-all":showAllPanels();break;
  case "toggle-lock":toggleLock();break;

  case "help":
   document.getElementById("helpDialog").classList.add("show");
   break;

  case "about":
   alert("FABRIC ANALYZER\nابزار طراحی و تحلیل ساختار پارچه");
   break;
 }
}

/* MENU OPEN / CLOSE */

document.querySelectorAll(".menu-trigger").forEach(trigger=>{

 trigger.addEventListener("click",event=>{
  event.stopPropagation();

  const group=trigger.parentElement;
  const wasOpen=group.classList.contains("open");

  document.querySelectorAll(".menu-group").forEach(item=>{
   item.classList.remove("open");
  });

  if(!wasOpen)group.classList.add("open");
 });
});

document.querySelectorAll(".menu-item").forEach(item=>{
 item.addEventListener("click",()=>{
  runAction(item.dataset.action);

  document.querySelectorAll(".menu-group").forEach(group=>{
   group.classList.remove("open");
  });
 });
});

document.addEventListener("click",event=>{
 if(!event.target.closest(".menu-group")){
  document.querySelectorAll(".menu-group").forEach(group=>{
   group.classList.remove("open");
  });
 }
});

document.getElementById("closeHelp").addEventListener("click",()=>{
 document.getElementById("helpDialog").classList.remove("show");
});

document.getElementById("helpDialog").addEventListener("click",event=>{
 if(event.target.id==="helpDialog"){
  event.currentTarget.classList.remove("show");
 }
});

/* PAINT TOOL */

document.getElementById("paintTool").addEventListener("click",()=>{
 document.getElementById("paintTool").classList.add("active");
});

/* KEYBOARD SHORTCUTS */

document.addEventListener("keydown",event=>{

 const key=event.key.toLowerCase();
 const ctrl=event.ctrlKey||event.metaKey;
 const target=event.target;

 const isColorInput=
  target instanceof HTMLInputElement&&target.type==="color";

 const isEditable=
  target instanceof HTMLInputElement||
  target instanceof HTMLTextAreaElement||
  target.isContentEditable;

 if(event.key==="Escape"){
  document.querySelectorAll(".menu-group").forEach(group=>group.classList.remove("open"));
  document.getElementById("helpDialog").classList.remove("show");
  return;
 }

 if(
  event.key==="Enter"&&
  !event.shiftKey&&
  !event.altKey&&
  !isColorInput&&
  target.tagName!=="BUTTON"
 ){
  event.preventDefault();
  applySettings();
  return;
 }

 if(ctrl){

  if(key==="s"){
   event.preventDefault();
   exportJPG();
   return;
  }

  if(key==="enter"){
   event.preventDefault();
   applySettings();
   return;
  }

  if(key==="z"&&!event.shiftKey){
   if(isEditable&&!isColorInput)return;
   event.preventDefault();
   undo();
   return;
  }

  if(key==="y"||(key==="z"&&event.shiftKey)){
   if(isEditable&&!isColorInput)return;
   event.preventDefault();
   redo();
   return;
  }
 }

 if(!ctrl&&!isEditable&&!isColorInput){

  if(event.key==="+"){zoomIn();return}
  if(event.key==="-"){zoomOut();return}
  if(event.key==="0"){zoomReset();return}
 }
});

/* START */

loadState();
syncInputs();

renderWarpControls();
renderWeftControls();

updateLockUI();
updateHistoryButtons();

draw();

window.addEventListener("resize",draw);
</script>
</body>
</html>
