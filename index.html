
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Fabric Analyzer</title>

<style>
:root{
  --bg:#111318;
  --panel:#1b1e25;
  --panel2:#252a34;
  --text:#f4f5f7;
  --muted:#b0b6c2;
  --accent:#d5a85c;
  --border:#3a404d;
}
*{box-sizing:border-box}
body{
  margin:0;padding:10px;background:var(--bg);color:var(--text);
  font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:14px;
}
.app{width:100%;max-width:1500px;margin:auto}
header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:11px;
}
.brand{font-size:20px;font-weight:800}
.brand span{color:var(--accent)}
.status{color:var(--muted);font-size:11px}
.panel{
  background:var(--panel);border:1px solid var(--border);
  border-radius:13px;padding:11px;margin-bottom:10px;
}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.group{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.group-title{color:var(--muted);font-size:13px;font-weight:600}
input,button{font-family:inherit}
input[type=number]{
  width:54px;height:36px;border:1px solid var(--border);
  background:var(--panel2);color:white;border-radius:8px;
  padding:4px;text-align:center;font-size:15px;
}
button{
  border:1px solid var(--border);background:var(--panel2);
  color:var(--text);border-radius:8px;padding:9px 12px;
  cursor:pointer;font-size:13px;font-weight:600;
  transition:background .15s,border-color .15s,opacity .15s;
}
button:active{transform:scale(.97)}
button:disabled{opacity:.35;cursor:not-allowed;transform:none}
button.primary{
  background:var(--accent);border-color:var(--accent);color:#171717;
}
details{margin-top:11px;border-top:1px solid var(--border);padding-top:10px}
summary{
  cursor:pointer;color:#e7e9ee;font-size:13px;font-weight:700;
  padding:4px 0;list-style:none;display:flex;align-items:center;
  justify-content:space-between;
}
summary::after{content:"＋";color:var(--accent);font-size:17px}
details[open] summary::after{content:"−"}
.color-grid{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;margin-top:12px;
}
.color-item{
  display:flex;align-items:center;gap:6px;padding:6px;
  background:var(--panel2);border:1px solid var(--border);
  border-radius:9px;min-width:0;
}
.color-item.active{
  border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);
}
.color-select{
  width:31px;height:31px;border:2px solid rgba(255,255,255,.25);
  border-radius:7px;padding:0;flex-shrink:0;
}
.color-item input[type=color]{
  width:29px;height:29px;border:0;padding:0;
  background:transparent;flex-shrink:0;
}
.color-name{font-size:11px;color:#e2e5ea;white-space:nowrap}
.color-help{color:var(--muted);font-size:11px;margin-top:10px;line-height:1.8}
.workspace{background:#e8e8e8;border-radius:12px;padding:5px;overflow:hidden}
.canvas-tools{
  display:flex;justify-content:space-between;align-items:center;
  gap:7px;margin-bottom:6px;direction:rtl;flex-wrap:wrap;
}
.tools-right,.history-tools{display:flex;align-items:center;gap:5px}
.history-tools{direction:ltr}
.history-button{
  min-width:43px;min-height:39px;padding:7px 10px;
  display:flex;align-items:center;justify-content:center;
  gap:5px;background:#343a45;border-color:#737b89;
  color:white;font-size:17px;
}
.history-button span{font-size:11px}
.lock-button{
  display:flex;align-items:center;justify-content:center;gap:7px;
  min-width:145px;padding:9px 12px;background:#263b32;
  border:1px solid #477b5e;color:#c9f1d6;font-size:12px;
}
.lock-button.locked{
  background:#4a302b;border-color:#a85e4e;color:#ffe0d8;
}
.clear-button{
  background:#542e2e;border-color:#a95858;color:#ffe0e0;
  min-height:39px;
}
.clear-button.armed{
  background:#a83232;border-color:#ff7777;color:white;
  animation:pulse .8s infinite alternate;
}
@keyframes pulse{from{opacity:1}to{opacity:.72}}
.canvas-wrap{
  width:100%;overflow-x:auto;overflow-y:hidden;direction:ltr;
  touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
}
canvas{
  display:block;height:auto;max-width:none;
  touch-action:pan-x pan-y;cursor:crosshair;
}
.footer{
  display:flex;justify-content:space-between;align-items:center;
  gap:8px;flex-wrap:wrap;color:var(--muted);
  font-size:11px;margin-top:10px;
}
.bottom-actions{display:flex;justify-content:center;margin:16px 0 8px}
.bottom-actions button{min-width:180px;font-size:14px;padding:12px 20px}
@media(max-width:600px){
  body{padding:7px}
  .brand{font-size:18px}
  .panel{padding:9px}
  .toolbar{gap:10px}
  .group{width:100%;gap:7px}
  .color-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .workspace{padding:4px}
  .canvas-tools{gap:6px}
  .tools-right{width:100%;justify-content:space-between}
  .lock-button{min-width:145px;min-height:40px}
  .history-button{min-width:45px;min-height:40px}
  .clear-button{width:100%}
  .bottom-actions button{width:100%}
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="brand">FABRIC <span>ANALYZER</span></div>
  <div class="status" id="saveStatus">ذخیره خودکار فعال</div>
</header>

<section class="panel">
  <div class="toolbar">
    <div class="group">
      <span class="group-title">ستون</span>
      <input id="cols" type="number" min="1" max="40" value="10">
      <span class="group-title">ردیف</span>
      <input id="rows" type="number" min="1" max="40" value="10">
    </div>

    <div class="group">
      <span class="group-title">تار</span>
      <input id="warps" type="number" min="1" max="16" value="16">
      <span class="group-title">پود</span>
      <input id="wefts" type="number" min="1" max="16" value="3">
      <button class="primary" id="applyBtn">اعمال</button>
    </div>
  </div>

  <details>
    <summary>تنظیم رنگ‌های تار</summary>
    <div class="color-grid" id="warpGrid"></div>
    <div class="color-help">رنگ هر تار به ترتیب در ستون‌ها تکرار می‌شود.</div>
  </details>

  <details>
    <summary>تنظیم و انتخاب رنگ‌های پود</summary>
    <div class="color-grid" id="weftGrid"></div>
    <div class="color-help">
      برای انتخاب رنگ فعال، روی مربع رنگ بزن.
      برای تغییر رنگ هر پود، روی انتخاب‌گر رنگ کنار آن بزن.
    </div>
  </details>
</section>

<section class="workspace">
  <div class="canvas-tools">

    <div class="tools-right">
      <button class="lock-button" id="lockBtn">
        <span id="lockIcon">🔓</span>
        <span id="lockText">قفل رنگ‌گذاری: خاموش</span>
      </button>

      <button class="clear-button" id="clearBtn">
        🗑 پاک کردن کامل طرح
      </button>
    </div>

    <div class="history-tools">
      <button class="history-button" id="undoBtn"
        title="Undo - Ctrl + Z" disabled>
        ↶ <span>Undo</span>
      </button>

      <button class="history-button" id="redoBtn"
        title="Redo - Ctrl + Y" disabled>
        ↷ <span>Redo</span>
      </button>
    </div>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="fabricCanvas"></canvas>
  </div>
</section>

<div class="footer">
  <span id="gridInfo"></span>
  <span id="modeInfo">حالت رنگ‌گذاری فعال است</span>
</div>

<div class="bottom-actions">
  <button class="primary" id="jpgBtn">ذخیره خروجی JPG</button>
</div>

</div>

<script>
const canvas=document.getElementById("fabricCanvas");
const ctx=canvas.getContext("2d");

const defaultWarpColors=[
 "#e63946","#457b9d","#2a9d8f","#e9c46a",
 "#f4a261","#9b5de5","#00b4d8","#80b918",
 "#f72585","#7209b7","#4361ee","#4d908e",
 "#f94144","#90be6d","#f8961e","#577590"
];

const defaultWeftColors=[
 "#ff3b30","#00c853","#2979ff","#ffea00",
 "#d500f9","#00b8d4","#ff9100","#8bc34a",
 "#e91e63","#795548","#607d8b","#cddc39",
 "#9c27b0","#03a9f4","#ff5722","#009688"
];

let state={
 cols:10,rows:10,warps:16,wefts:3,
 warpColors:[...defaultWarpColors],
 weftColors:[...defaultWeftColors],
 selectedWeft:0,
 marks:{},
 paintLocked:false
};

let CELL=48;
const LEFT=35,TOP=31,RIGHT=12,BOTTOM=18;
const MAX_HISTORY=100;

let undoHistory=[];
let redoHistory=[];
let colorEditSnapshot=null;
let clearArmed=false;
let clearTimer=null;

/* تاریخچه */

function makeSnapshot(){
 return JSON.parse(JSON.stringify({
  cols:state.cols,
  rows:state.rows,
  warps:state.warps,
  wefts:state.wefts,
  warpColors:state.warpColors,
  weftColors:state.weftColors,
  selectedWeft:state.selectedWeft,
  marks:state.marks
 }));
}

function snapshotsEqual(a,b){
 return JSON.stringify(a)===JSON.stringify(b);
}

function pushHistory(snapshot){
 undoHistory.push(snapshot);

 if(undoHistory.length>MAX_HISTORY){
  undoHistory.shift();
 }

 redoHistory=[];
 updateHistoryButtons();
}

function startColorEdit(){
 if(!colorEditSnapshot){
  colorEditSnapshot=makeSnapshot();
 }
}

function finishColorEdit(){
 if(!colorEditSnapshot)return;

 const before=colorEditSnapshot;
 const after=makeSnapshot();
 colorEditSnapshot=null;

 if(!snapshotsEqual(before,after)){
  pushHistory(before);
 }
}

function restoreSnapshot(snapshot){
 const locked=state.paintLocked;

 state={
  ...state,
  ...JSON.parse(JSON.stringify(snapshot)),
  paintLocked:locked
 };

 syncInputs();
 renderWarpControls();
 renderWeftControls();
 updateGridInfo();
 updateHistoryButtons();
 draw();
 saveState();
}

function undo(){
 finishColorEdit();

 if(!undoHistory.length)return;

 redoHistory.push(makeSnapshot());
 const previous=undoHistory.pop();
 restoreSnapshot(previous);
}

function redo(){
 finishColorEdit();

 if(!redoHistory.length)return;

 undoHistory.push(makeSnapshot());

 if(undoHistory.length>MAX_HISTORY){
  undoHistory.shift();
 }

 const next=redoHistory.pop();
 restoreSnapshot(next);
}

function updateHistoryButtons(){
 document.getElementById("undoBtn").disabled=!undoHistory.length;
 document.getElementById("redoBtn").disabled=!redoHistory.length;
}

document.getElementById("undoBtn").addEventListener("click",undo);
document.getElementById("redoBtn").addEventListener("click",redo);

/* ذخیره و بازیابی */

function saveState(){
 try{
  localStorage.setItem("fabricAnalyzerState",JSON.stringify(state));
  document.getElementById("saveStatus").textContent="ذخیره شد ✓";
 }catch(e){
  document.getElementById("saveStatus").textContent="خطا در ذخیره";
 }
}

function loadState(){
 try{
  const saved=localStorage.getItem("fabricAnalyzerState");
  if(!saved)return;

  const p=JSON.parse(saved);

  const oldWeftColors=Array.isArray(p.weftColors)
   ?p.weftColors
   :(Array.isArray(p.weftPalette)?p.weftPalette:defaultWeftColors);

  state={
   ...state,
   ...p,
   cols:Math.max(1,Math.min(40,Number(p.cols)||10)),
   rows:Math.max(1,Math.min(40,Number(p.rows)||10)),
   warps:Math.max(1,Math.min(16,Number(p.warps)||16)),
   wefts:Math.max(1,Math.min(16,Number(p.wefts)||3)),

   warpColors:Array.from({length:16},
    (_,i)=>p.warpColors?.[i]||defaultWarpColors[i]),

   weftColors:Array.from({length:16},
    (_,i)=>oldWeftColors[i]||defaultWeftColors[i]),

   selectedWeft:Math.max(0,Math.min(15,Number(p.selectedWeft)||0)),
   marks:p.marks||{},
   paintLocked:false
  };
 }catch(e){
  console.warn("Saved data could not be loaded.");
 }
}

function syncInputs(){
 document.getElementById("cols").value=state.cols;
 document.getElementById("rows").value=state.rows;
 document.getElementById("warps").value=state.warps;
 document.getElementById("wefts").value=state.wefts;
}

function updateGridInfo(){
 document.getElementById("gridInfo").textContent=
  `${state.cols} ستون · ${state.rows} ردیف · ${state.warps} تار · ${state.wefts} پود`;
}

/* رنگ‌ها */

function renderColorItem(container,index,color,type){
 const item=document.createElement("div");
 item.className="color-item";

 if(type==="weft"&&state.selectedWeft===index){
  item.classList.add("active");
 }

 const select=document.createElement("button");
 select.className="color-select";
 select.style.background=color;
 select.title="انتخاب رنگ";

 if(type==="weft"){
  select.addEventListener("click",()=>{
   state.selectedWeft=index;
   renderWeftControls();
   saveState();
  });
 }else{
  select.style.cursor="default";
  select.disabled=true;
 }

 const picker=document.createElement("input");
 picker.type="color";
 picker.value=color;
 picker.title="تغییر رنگ";

 picker.addEventListener("pointerdown",startColorEdit);
 picker.addEventListener("focus",startColorEdit);

 picker.addEventListener("input",()=>{
  startColorEdit();

  if(type==="warp"){
   state.warpColors[index]=picker.value;
  }else{
   state.weftColors[index]=picker.value;
   select.style.background=picker.value;
  }

  draw();
  saveState();
 });

 picker.addEventListener("change",finishColorEdit);
 picker.addEventListener("blur",finishColorEdit);

 const name=document.createElement("span");
 name.className="color-name";
 name.textContent=(type==="warp"?"تار ":"پود ")+(index+1);

 item.append(select,picker,name);
 container.appendChild(item);
}

function renderWarpControls(){
 const box=document.getElementById("warpGrid");
 box.innerHTML="";

 for(let i=0;i<state.warps;i++){
  renderColorItem(box,i,state.warpColors[i],"warp");
 }
}

function renderWeftControls(){
 const box=document.getElementById("weftGrid");
 box.innerHTML="";

 for(let i=0;i<state.wefts;i++){
  renderColorItem(box,i,state.weftColors[i],"weft");
 }
}

/* قفل رنگ‌گذاری */

function updateLockUI(){
 const button=document.getElementById("lockBtn");
 const icon=document.getElementById("lockIcon");
 const text=document.getElementById("lockText");
 const info=document.getElementById("modeInfo");

 if(state.paintLocked){
  button.classList.add("locked");
  icon.textContent="🔒";
  text.textContent="قفل رنگ‌گذاری: روشن";
  info.textContent="رنگ‌گذاری غیرفعال · اسکرول آزاد";
 }else{
  button.classList.remove("locked");
  icon.textContent="🔓";
  text.textContent="قفل رنگ‌گذاری: خاموش";
  info.textContent="حالت رنگ‌گذاری فعال است";
 }
}

document.getElementById("lockBtn").addEventListener("click",()=>{
 state.paintLocked=!state.paintLocked;
 updateLockUI();
 saveState();
});

/* پاک کردن کامل طرح با دو مرحله */

function resetClearButton(){
 clearArmed=false;
 clearTimer=null;

 const button=document.getElementById("clearBtn");
 button.classList.remove("armed");
 button.textContent="🗑 پاک کردن کامل طرح";
}

document.getElementById("clearBtn").addEventListener("click",()=>{
 const button=document.getElementById("clearBtn");

 if(!clearArmed){
  clearArmed=true;
  button.classList.add("armed");
  button.textContent="⚠️ برای تأیید دوباره بزن";

  clearTimer=setTimeout(()=>{
   resetClearButton();
  },5000);

  return;
 }

 clearTimeout(clearTimer);
 resetClearButton();

 if(Object.keys(state.marks).length===0){
  document.getElementById("saveStatus").textContent="طرح از قبل خالی است";
  return;
 }

 finishColorEdit();

 const before=makeSnapshot();

 state.marks={};

 pushHistory(before);
 draw();
 saveState();
});

/* رسم شبکه */

function updateCellSize(){
 CELL=window.innerWidth<=600?48:62;
}

function draw(){
 updateCellSize();

 const width=LEFT+state.cols*CELL+RIGHT;
 const height=TOP+state.rows*CELL+BOTTOM;
 const dpr=Math.max(1,window.devicePixelRatio||1);

 canvas.width=Math.round(width*dpr);
 canvas.height=Math.round(height*dpr);
 canvas.style.width=width+"px";
 canvas.style.height=height+"px";

 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.clearRect(0,0,width,height);
 ctx.fillStyle="#e8e8e8";
 ctx.fillRect(0,0,width,height);

 ctx.fillStyle="#222";
 ctx.font="bold 11px Tahoma, Arial";
 ctx.textAlign="center";
 ctx.textBaseline="middle";

 for(let c=0;c<state.cols;c++){
  ctx.fillText(String(c+1),LEFT+c*CELL+CELL/2,15);
 }

 for(let r=0;r<state.rows;r++){
  ctx.fillText(String(r+1),17,TOP+r*CELL+CELL/2);
 }

 for(let r=0;r<state.rows;r++){
  for(let c=0;c<state.cols;c++){
   const x=LEFT+c*CELL;
   const y=TOP+r*CELL;

   ctx.fillStyle="#fff";
   ctx.fillRect(x,y,CELL,CELL);

   const partHeight=CELL/state.wefts;

   for(let k=0;k<state.wefts;k++){
    const key=`${r},${c},${k}`;
    const color=state.marks[key];

    if(color){
     ctx.fillStyle=color;
     ctx.fillRect(
      x+4,
      y+k*partHeight+2,
      CELL-8,
      Math.max(1,partHeight-4)
     );
    }
   }

   ctx.save();
   ctx.strokeStyle="rgba(0,0,0,0.42)";
   ctx.lineWidth=0.8;

   for(let k=1;k<state.wefts;k++){
    const lineY=y+k*partHeight;
    ctx.beginPath();
    ctx.moveTo(x+3,lineY);
    ctx.lineTo(x+CELL-3,lineY);
    ctx.stroke();
   }
   ctx.restore();

   const warpColor=state.warpColors[c%state.warps];

   ctx.beginPath();
   ctx.roundRect(x+1,y+1,CELL-2,CELL-2,6);
   ctx.strokeStyle=warpColor;
   ctx.lineWidth=4;
   ctx.stroke();

   ctx.beginPath();
   ctx.roundRect(x+1,y+1,CELL-2,CELL-2,6);
   ctx.strokeStyle="#111";
   ctx.lineWidth=1.4;
   ctx.stroke();
  }
 }
}

/* تشخیص خانه انتخاب‌شده */

function getCellFromPointer(event){
 const rect=canvas.getBoundingClientRect();

 const x=(event.clientX-rect.left)*
  (canvas.width/rect.width)/(window.devicePixelRatio||1)-LEFT;

 const y=(event.clientY-rect.top)*
  (canvas.height/rect.height)/(window.devicePixelRatio||1)-TOP;

 if(x<0||y<0)return null;

 const col=Math.floor(x/CELL);
 const row=Math.floor(y/CELL);

 if(col<0||col>=state.cols||row<0||row>=state.rows){
  return null;
 }

 const localY=y-row*CELL;
 const part=Math.floor(localY/(CELL/state.wefts));

 if(part<0||part>=state.wefts)return null;

 return {row,col,part};
}

/* رنگ‌آمیزی و ثبت در تاریخچه */

canvas.addEventListener("pointerdown",event=>{
 if(state.paintLocked)return;
 if(event.button!==undefined&&event.button!==0)return;

 const cell=getCellFromPointer(event);
 if(!cell)return;

 finishColorEdit();

 const before=makeSnapshot();
 const key=`${cell.row},${cell.col},${cell.part}`;
 const selectedColor=state.weftColors[state.selectedWeft];

 if(state.marks[key]===selectedColor){
  delete state.marks[key];
 }else{
  state.marks[key]=selectedColor;
 }

 pushHistory(before);
 draw();
 saveState();
});

/* اعمال تنظیمات */

document.getElementById("applyBtn").addEventListener("click",applySettings);

function applySettings(){
 const cols=Number(document.getElementById("cols").value);
 const rows=Number(document.getElementById("rows").value);
 const warps=Number(document.getElementById("warps").value);
 const wefts=Number(document.getElementById("wefts").value);

 if(
  !Number.isInteger(cols)||cols<1||cols>40||
  !Number.isInteger(rows)||rows<1||rows>40||
  !Number.isInteger(warps)||warps<1||warps>16||
  !Number.isInteger(wefts)||wefts<1||wefts>16
 ){
  alert("تعداد تار و پود باید بین ۱ تا ۱۶ و ردیف و ستون بین ۱ تا ۴۰ باشد.");
  return;
 }

 finishColorEdit();

 const before=makeSnapshot();

 state.cols=cols;
 state.rows=rows;
 state.warps=warps;
 state.wefts=wefts;
 state.selectedWeft=Math.min(state.selectedWeft,wefts-1);

 for(const key of Object.keys(state.marks)){
  const [r,c,k]=key.split(",").map(Number);

  if(r>=rows||c>=cols||k>=wefts){
   delete state.marks[key];
  }
 }

 const after=makeSnapshot();

 if(!snapshotsEqual(before,after)){
  pushHistory(before);
 }

 renderWarpControls();
 renderWeftControls();
 updateGridInfo();
 draw();
 saveState();
}

/* خروجی JPG */

function exportJPG(){
 const link=document.createElement("a");
 link.download="Fabric-Analyzer.jpg";
 link.href=canvas.toDataURL("image/jpeg",0.98);
 link.click();
}

document.getElementById("jpgBtn").addEventListener("click",exportJPG);

/* میانبرهای صفحه‌کلید */

document.addEventListener("keydown",event=>{
 const key=event.key.toLowerCase();
 const ctrl=event.ctrlKey||event.metaKey;

 if(!ctrl)return;

 const target=event.target;
 const isColorInput=target instanceof HTMLInputElement&&target.type==="color";
 const isEditable=target instanceof HTMLInputElement||
  target instanceof HTMLTextAreaElement||
  target.isContentEditable;

 if(key==="s"){
  event.preventDefault();
  exportJPG();
  return;
 }

 if(key==="enter"){
  event.preventDefault();
  applySettings();
  return;
 }

 if(key==="z"&&!event.shiftKey){
  if(isEditable&&!isColorInput)return;
  event.preventDefault();
  undo();
  return;
 }

 if(key==="y"||(key==="z"&&event.shiftKey)){
  if(isEditable&&!isColorInput)return;
  event.preventDefault();
  redo();
 }
});

/* شروع برنامه */

loadState();
syncInputs();
updateGridInfo();

renderWarpControls();
renderWeftControls();
updateLockUI();
updateHistoryButtons();
draw();

window.addEventListener("resize",draw);
</script>
