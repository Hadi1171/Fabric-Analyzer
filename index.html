
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Fabric Analyzer</title>

<style>
:root{
  --bg:#101b35;
  --panel:#192743;
  --panel2:#233553;
  --panel3:#2b4163;
  --text:#f3f6fc;
  --muted:#aab8ce;
  --accent:#d9ae68;
  --border:#344967;
  --danger:#a9424b;
}

*{box-sizing:border-box}

body{
  margin:0;
  padding:12px;
  background:var(--bg);
  color:var(--text);
  font-family:Tahoma,"Segoe UI",Arial,sans-serif;
  font-size:14px;
}

.app{
  width:100%;
  max-width:1500px;
  margin:auto;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.brand{
  font-size:20px;
  font-weight:800;
  letter-spacing:.5px;
}

.brand span{color:var(--accent)}

.status{
  color:var(--muted);
  font-size:11px;
}

.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
  padding:13px;
  margin-bottom:12px;
  box-shadow:0 5px 18px rgba(0,0,0,.12);
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:12px;
}

.group{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.group-title{
  color:var(--muted);
  font-size:13px;
  font-weight:600;
}

input,button{font-family:inherit}

input[type=number]{
  width:58px;
  height:38px;
  border:1px solid var(--border);
  background:var(--panel2);
  color:white;
  border-radius:9px;
  padding:4px;
  text-align:center;
  font-size:15px;
  outline:none;
}

input[type=number]:focus{
  border-color:var(--accent);
}

button{
  border:1px solid var(--border);
  background:var(--panel2);
  color:var(--text);
  border-radius:9px;
  padding:9px 13px;
  cursor:pointer;
  font-size:13px;
  font-weight:600;
  transition:background .15s,border-color .15s,opacity .15s;
}

button:active{transform:scale(.96)}

button:disabled{
  opacity:.35;
  cursor:not-allowed;
  transform:none;
}

button.primary{
  background:var(--accent);
  border-color:var(--accent);
  color:#18243a;
}

button.primary:hover{
  background:#e8c17f;
}

details{
  margin-top:13px;
  border-top:1px solid var(--border);
  padding-top:11px;
}

summary{
  cursor:pointer;
  color:#edf2fb;
  font-size:14px;
  font-weight:700;
  padding:5px 2px;
  list-style:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  user-select:none;
}

summary::-webkit-details-marker{display:none}

summary::after{
  content:"＋";
  color:var(--accent);
  font-size:18px;
  font-weight:400;
}

details[open] summary::after{content:"−"}

.color-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:9px;
  margin-top:13px;
}

.color-item{
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:11px;
  min-width:0;
  min-height:48px;
  cursor:pointer;
  transition:border-color .15s,background .15s;
  user-select:none;
}

.color-item:hover{
  background:var(--panel3);
  border-color:#657c9e;
}

.color-item.active{
  border-color:var(--accent);
  background:#34425b;
  box-shadow:0 0 0 1px var(--accent);
}

.color-select{
  width:32px;
  height:32px;
  border:2px solid rgba(255,255,255,.35);
  border-radius:8px;
  padding:0;
  flex-shrink:0;
  pointer-events:none;
}

.color-item input[type=color]{
  width:31px;
  height:31px;
  border:0;
  padding:0;
  background:transparent;
  flex-shrink:0;
  cursor:pointer;
  border-radius:7px;
}

.color-name{
  font-size:12px;
  color:#e8edf7;
  white-space:nowrap;
  flex:1;
}

.workspace{
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:15px;
  padding:10px;
  overflow:hidden;
}

.canvas-tools{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:9px;
  direction:rtl;
  flex-wrap:wrap;
}

.tools-right,.history-tools{
  display:flex;
  align-items:center;
  gap:7px;
}

.history-tools{direction:ltr}

.icon-button{
  width:43px;
  height:42px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--panel2);
  border:1px solid var(--border);
  color:white;
  border-radius:10px;
}

.icon-button svg{
  width:21px;
  height:21px;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.lock-button{
  width:45px;
  height:42px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#244b42;
  border:1px solid #397e69;
  color:#c9f5e4;
  border-radius:10px;
}

.lock-button.locked{
  background:#59363d;
  border-color:#a65a62;
  color:#ffe1e3;
}

.lock-button svg{
  width:21px;
  height:21px;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.clear-button{
  width:45px;
  height:42px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#512e3b;
  border:1px solid #9d5260;
  color:#ffe0e5;
  border-radius:10px;
}

.clear-button svg{
  width:21px;
  height:21px;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.clear-button.armed{
  background:#a83242;
  border-color:#ff7b8b;
  color:white;
  animation:pulse .8s infinite alternate;
}

@keyframes pulse{
  from{opacity:1}
  to{opacity:.65}
}

.canvas-wrap{
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  direction:ltr;
  touch-action:pan-x pan-y;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
  background:var(--bg);
  border-radius:9px;
}

canvas{
  display:block;
  height:auto;
  max-width:none;
  margin-left:auto;
  margin-right:auto;
  touch-action:pan-x pan-y;
  cursor:crosshair;
}

.bottom-actions{
  display:flex;
  justify-content:center;
  margin:14px 0 5px;
}

.bottom-actions button{
  min-width:190px;
  font-size:14px;
  padding:12px 20px;
}

@media(max-width:700px){
  body{padding:7px}

  .brand{font-size:18px}

  .panel{padding:10px}

  .toolbar{gap:12px}

  .group{
    width:100%;
    gap:7px;
  }

  .color-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:7px;
  }

  .color-item{
    padding:7px;
    gap:7px;
  }

  .workspace{padding:7px}

  .canvas-tools{gap:6px}

  .tools-right{
    width:auto;
    justify-content:flex-start;
  }

  .history-tools{margin-right:auto}

  .bottom-actions button{width:100%}
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="brand">FABRIC <span>ANALYZER</span></div>
  <div class="status" id="saveStatus">✓</div>
</header>

<section class="panel">

  <div class="toolbar">
    <div class="group">
      <span class="group-title">ستون</span>
      <input id="cols" type="number" min="1" max="40" value="10">

      <span class="group-title">ردیف</span>
      <input id="rows" type="number" min="1" max="40" value="10">
    </div>

    <div class="group">
      <span class="group-title">تار</span>
      <input id="warps" type="number" min="1" max="16" value="16">

      <span class="group-title">پود</span>
      <input id="wefts" type="number" min="1" max="16" value="3">

      <button class="primary" id="applyBtn">اعمال</button>
    </div>
  </div>

  <details>
    <summary>رنگ‌های تار</summary>
    <div class="color-grid" id="warpGrid"></div>
  </details>

  <details>
    <summary>رنگ‌های پود</summary>
    <div class="color-grid" id="weftGrid"></div>
  </details>

</section>

<section class="workspace">

  <div class="canvas-tools">

    <div class="tools-right">

      <button class="lock-button" id="lockBtn"
        title="قفل رنگ‌گذاری" aria-label="قفل رنگ‌گذاری">
        <svg id="lockIcon" viewBox="0 0 24 24">
          <rect x="4" y="10" width="16" height="11" rx="2"></rect>
          <path d="M8 10V7a4 4 0 0 1 7.5-2"></path>
        </svg>
      </button>

      <button class="clear-button" id="clearBtn"
        title="پاک کردن کامل طرح" aria-label="پاک کردن کامل طرح">
        <svg viewBox="0 0 24 24">
          <path d="M3 6h18"></path>
          <path d="M8 6V4h8v2"></path>
          <path d="M19 6l-1 14H6L5 6"></path>
          <path d="M10 11v5M14 11v5"></path>
        </svg>
      </button>

    </div>

    <div class="history-tools">

      <button class="icon-button" id="undoBtn"
        title="Undo - Ctrl + Z" aria-label="Undo" disabled>
        <svg viewBox="0 0 24 24">
          <path d="M9 14L4 9l5-5"></path>
          <path d="M4 9h10a6 6 0 0 1 0 12h-2"></path>
        </svg>
      </button>

      <button class="icon-button" id="redoBtn"
        title="Redo - Ctrl + Y" aria-label="Redo" disabled>
        <svg viewBox="0 0 24 24">
          <path d="M15 14l5-5-5-5"></path>
          <path d="M20 9H10a6 6 0 0 0 0 12h2"></path>
        </svg>
      </button>

    </div>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="fabricCanvas"></canvas>
  </div>

</section>

<div class="bottom-actions">
  <button class="primary" id="jpgBtn">ذخیره خروجی JPG</button>
</div>

</div>

<script>
const canvas=document.getElementById("fabricCanvas");
const ctx=canvas.getContext("2d");

const defaultWarpColors=[
 "#e63946","#457b9d","#2a9d8f","#e9c46a",
 "#f4a261","#9b5de5","#00b4d8","#80b918",
 "#f72585","#7209b7","#4361ee","#4d908e",
 "#f94144","#90be6d","#f8961e","#577590"
];

const defaultWeftColors=[
 "#ff3b30","#00c853","#2979ff","#ffea00",
 "#d500f9","#00b8d4","#ff9100","#8bc34a",
 "#e91e63","#795548","#607d8b","#cddc39",
 "#9c27b0","#03a9f4","#ff5722","#009688"
];

let state={
 cols:10,
 rows:10,
 warps:16,
 wefts:3,
 warpColors:[...defaultWarpColors],
 weftColors:[...defaultWeftColors],
 selectedWeft:0,
 marks:{},
 paintLocked:false
};

let CELL=48;

const LEFT=35;
const TOP=31;
const RIGHT=12;
const BOTTOM=18;
const MAX_HISTORY=100;

let undoHistory=[];
let redoHistory=[];
let colorEditSnapshot=null;
let clearArmed=false;
let clearTimer=null;

/* تاریخچه */

function makeSnapshot(){
 return JSON.parse(JSON.stringify({
  cols:state.cols,
  rows:state.rows,
  warps:state.warps,
  wefts:state.wefts,
  warpColors:state.warpColors,
  weftColors:state.weftColors,
  selectedWeft:state.selectedWeft,
  marks:state.marks
 }));
}

function snapshotsEqual(a,b){
 return JSON.stringify(a)===JSON.stringify(b);
}

function pushHistory(snapshot){
 undoHistory.push(snapshot);

 if(undoHistory.length>MAX_HISTORY){
  undoHistory.shift();
 }

 redoHistory=[];
 updateHistoryButtons();
}

function startColorEdit(){
 if(!colorEditSnapshot){
  colorEditSnapshot=makeSnapshot();
 }
}

function finishColorEdit(){
 if(!colorEditSnapshot)return;

 const before=colorEditSnapshot;
 const after=makeSnapshot();

 colorEditSnapshot=null;

 if(!snapshotsEqual(before,after)){
  pushHistory(before);
 }
}

function restoreSnapshot(snapshot){
 const locked=state.paintLocked;

 state={
  ...state,
  ...JSON.parse(JSON.stringify(snapshot)),
  paintLocked:locked
 };

 syncInputs();
 renderWarpControls();
 renderWeftControls();
 draw();
 saveState();
 updateHistoryButtons();
}

function undo(){
 finishColorEdit();

 if(!undoHistory.length)return;

 redoHistory.push(makeSnapshot());

 const previous=undoHistory.pop();
 restoreSnapshot(previous);
}

function redo(){
 finishColorEdit();

 if(!redoHistory.length)return;

 undoHistory.push(makeSnapshot());

 if(undoHistory.length>MAX_HISTORY){
  undoHistory.shift();
 }

 const next=redoHistory.pop();
 restoreSnapshot(next);
}

function updateHistoryButtons(){
 document.getElementById("undoBtn").disabled=!undoHistory.length;
 document.getElementById("redoBtn").disabled=!redoHistory.length;
}

document.getElementById("undoBtn").addEventListener("click",undo);
document.getElementById("redoBtn").addEventListener("click",redo);

/* ذخیره و بازیابی */

function saveState(){
 try{
  localStorage.setItem("fabricAnalyzerState",JSON.stringify(state));
  document.getElementById("saveStatus").textContent="✓";
 }catch(e){
  document.getElementById("saveStatus").textContent="!";
 }
}

function loadState(){
 try{
  const saved=localStorage.getItem("fabricAnalyzerState");
  if(!saved)return;

  const p=JSON.parse(saved);

  const oldWeftColors=Array.isArray(p.weftColors)
   ?p.weftColors
   :(Array.isArray(p.weftPalette)?p.weftPalette:defaultWeftColors);

  state={
   ...state,
   ...p,

   cols:Math.max(1,Math.min(40,Number(p.cols)||10)),
   rows:Math.max(1,Math.min(40,Number(p.rows)||10)),
   warps:Math.max(1,Math.min(16,Number(p.warps)||16)),
   wefts:Math.max(1,Math.min(16,Number(p.wefts)||3)),

   warpColors:Array.from({length:16},
    (_,i)=>p.warpColors?.[i]||defaultWarpColors[i]),

   weftColors:Array.from({length:16},
    (_,i)=>oldWeftColors[i]||defaultWeftColors[i]),

   selectedWeft:Math.max(0,Math.min(15,Number(p.selectedWeft)||0)),
   marks:p.marks||{},
   paintLocked:false
  };

 }catch(e){
  console.warn("Saved data could not be loaded.");
 }
}

function syncInputs(){
 document.getElementById("cols").value=state.cols;
 document.getElementById("rows").value=state.rows;
 document.getElementById("warps").value=state.warps;
 document.getElementById("wefts").value=state.wefts;
}

/* رنگ‌ها */

function renderColorItem(container,index,color,type){

 const item=document.createElement("div");
 item.className="color-item";

 if(type==="weft"&&state.selectedWeft===index){
  item.classList.add("active");
 }

 const select=document.createElement("button");
 select.className="color-select";
 select.style.background=color;
 select.title="انتخاب رنگ";

 if(type==="weft"){
  item.addEventListener("click",()=>{
   state.selectedWeft=index;
   renderWeftControls();
   saveState();
  });
 }

 const picker=document.createElement("input");
 picker.type="color";
 picker.value=color;
 picker.title="تغییر رنگ";

 /* کلیک روی انتخابگر، انتخاب کارت را اجرا نکند */
 picker.addEventListener("click",event=>{
  event.stopPropagation();
 });

 picker.addEventListener("pointerdown",event=>{
  event.stopPropagation();
  startColorEdit();
 });

 picker.addEventListener("focus",startColorEdit);

 picker.addEventListener("input",()=>{
  startColorEdit();

  if(type==="warp"){
   state.warpColors[index]=picker.value;
  }else{
   state.weftColors[index]=picker.value;
   select.style.background=picker.value;
  }

  draw();
  saveState();
 });

 picker.addEventListener("change",finishColorEdit);
 picker.addEventListener("blur",finishColorEdit);

 const name=document.createElement("span");
 name.className="color-name";
 name.textContent=String(index+1);

 item.append(select,picker,name);
 container.appendChild(item);
}

function renderWarpControls(){
 const box=document.getElementById("warpGrid");
 box.innerHTML="";

 for(let i=0;i<state.warps;i++){
  renderColorItem(box,i,state.warpColors[i],"warp");
 }
}

function renderWeftControls(){
 const box=document.getElementById("weftGrid");
 box.innerHTML="";

 for(let i=0;i<state.wefts;i++){
  renderColorItem(box,i,state.weftColors[i],"weft");
 }
}

/* قفل رنگ‌گذاری */

function updateLockUI(){
 const button=document.getElementById("lockBtn");
 const icon=document.getElementById("lockIcon");

 if(state.paintLocked){
  button.classList.add("locked");

  icon.innerHTML=`
   <rect x="4" y="10" width="16" height="11" rx="2"></rect>
   <path d="M7 10V7a5 5 0 0 1 10 0v3"></path>
  `;

  button.title="باز کردن قفل";
  button.setAttribute("aria-label","باز کردن قفل");

 }else{
  button.classList.remove("locked");

  icon.innerHTML=`
   <rect x="4" y="10" width="16" height="11" rx="2"></rect>
   <path d="M8 10V7a4 4 0 0 1 7.5-2"></path>
  `;

  button.title="قفل رنگ‌گذاری";
  button.setAttribute("aria-label","قفل رنگ‌گذاری");
 }
}

document.getElementById("lockBtn").addEventListener("click",()=>{
 state.paintLocked=!state.paintLocked;
 updateLockUI();
 saveState();
});

/* پاک کردن کامل طرح با دو مرحله */

function resetClearButton(){
 clearArmed=false;
 clearTimer=null;

 const button=document.getElementById("clearBtn");
 button.classList.remove("armed");
}

document.getElementById("clearBtn").addEventListener("click",()=>{

 const button=document.getElementById("clearBtn");

 if(!clearArmed){
  clearArmed=true;
  button.classList.add("armed");
  button.title="برای تأیید، دوباره کلیک کن";

  clearTimer=setTimeout(()=>{
   resetClearButton();
   button.title="پاک کردن کامل طرح";
  },5000);

  return;
 }

 clearTimeout(clearTimer);
 resetClearButton();
 button.title="پاک کردن کامل طرح";

 if(Object.keys(state.marks).length===0){
  return;
 }

 finishColorEdit();

 const before=makeSnapshot();

 state.marks={};

 pushHistory(before);
 draw();
 saveState();
});

/* رسم شبکه */

function updateCellSize(){
 CELL=window.innerWidth<=700?48:62;
}

function draw(){

 updateCellSize();

 const width=LEFT+state.cols*CELL+RIGHT;
 const height=TOP+state.rows*CELL+BOTTOM;

 const dpr=Math.max(1,window.devicePixelRatio||1);

 canvas.width=Math.round(width*dpr);
 canvas.height=Math.round(height*dpr);

 canvas.style.width=width+"px";
 canvas.style.height=height+"px";

 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.clearRect(0,0,width,height);

 /* زمینه خود بوم سورمه‌ای */
 ctx.fillStyle="#101b35";
 ctx.fillRect(0,0,width,height);

 ctx.fillStyle="#dce5f3";
 ctx.font="bold 11px Tahoma, Arial";
 ctx.textAlign="center";
 ctx.textBaseline="middle";

 /* شماره ستون‌ها */
 for(let c=0;c<state.cols;c++){
  ctx.fillText(
   String(c+1),
   LEFT+c*CELL+CELL/2,
   15
  );
 }

 /* شماره ردیف‌ها */
 for(let r=0;r<state.rows;r++){
  ctx.fillText(
   String(r+1),
   17,
   TOP+r*CELL+CELL/2
  );
 }

 for(let r=0;r<state.rows;r++){
  for(let c=0;c<state.cols;c++){

   const x=LEFT+c*CELL;
   const y=TOP+r*CELL;

   ctx.fillStyle="#f8f9fc";
   ctx.fillRect(x,y,CELL,CELL);

   const partHeight=CELL/state.wefts;

   /* رنگ پود */
   for(let k=0;k<state.wefts;k++){

    const key=`${r},${c},${k}`;
    const color=state.marks[key];

    if(color){
     ctx.fillStyle=color;

     ctx.fillRect(
      x+4,
      y+k*partHeight+2,
      CELL-8,
      Math.max(1,partHeight-4)
     );
    }
   }

   /* خطوط تقسیم پود */
   ctx.save();

   ctx.strokeStyle="rgba(0,0,0,0.42)";
   ctx.lineWidth=.8;

   for(let k=1;k<state.wefts;k++){
    const lineY=y+k*partHeight;

    ctx.beginPath();
    ctx.moveTo(x+3,lineY);
    ctx.lineTo(x+CELL-3,lineY);
    ctx.stroke();
   }

   ctx.restore();

   /* رنگ تار */
   const warpColor=state.warpColors[c%state.warps];

   ctx.beginPath();
   ctx.roundRect(x+1,y+1,CELL-2,CELL-2,6);

   ctx.strokeStyle=warpColor;
   ctx.lineWidth=4;
   ctx.stroke();

   /* مرز اصلی سلول */
   ctx.beginPath();
   ctx.roundRect(x+1,y+1,CELL-2,CELL-2,6);

   ctx.strokeStyle="#111827";
   ctx.lineWidth=1.4;
   ctx.stroke();
  }
 }
}

/* تشخیص خانه انتخاب‌شده */

function getCellFromPointer(event){

 const rect=canvas.getBoundingClientRect();

 const x=(event.clientX-rect.left)*
  (canvas.width/rect.width)/(window.devicePixelRatio||1)-LEFT;

 const y=(event.clientY-rect.top)*
  (canvas.height/rect.height)/(window.devicePixelRatio||1)-TOP;

 if(x<0||y<0)return null;

 const col=Math.floor(x/CELL);
 const row=Math.floor(y/CELL);

 if(col<0||col>=state.cols||row<0||row>=state.rows){
  return null;
 }

 const localY=y-row*CELL;
 const part=Math.floor(localY/(CELL/state.wefts));

 if(part<0||part>=state.wefts)return null;

 return {row,col,part};
}

/* رنگ‌آمیزی و ثبت در تاریخچه */

canvas.addEventListener("pointerdown",event=>{

 if(state.paintLocked)return;
 if(event.button!==undefined&&event.button!==0)return;

 const cell=getCellFromPointer(event);
 if(!cell)return;

 finishColorEdit();

 const before=makeSnapshot();
 const key=`${cell.row},${cell.col},${cell.part}`;
 const selectedColor=state.weftColors[state.selectedWeft];

 if(state.marks[key]===selectedColor){
  delete state.marks[key];
 }else{
  state.marks[key]=selectedColor;
 }

 pushHistory(before);
 draw();
 saveState();
});

/* اعمال تنظیمات */

document.getElementById("applyBtn")
 .addEventListener("click",applySettings);

function applySettings(){

 const cols=Number(document.getElementById("cols").value);
 const rows=Number(document.getElementById("rows").value);
 const warps=Number(document.getElementById("warps").value);
 const wefts=Number(document.getElementById("wefts").value);

 if(
  !Number.isInteger(cols)||cols<1||cols>40||
  !Number.isInteger(rows)||rows<1||rows>40||
  !Number.isInteger(warps)||warps<1||warps>16||
  !Number.isInteger(wefts)||wefts<1||wefts>16
 ){
  alert("تعداد تار و پود باید بین ۱ تا ۱۶ و ردیف و ستون بین ۱ تا ۴۰ باشد.");
  return;
 }

 finishColorEdit();

 const before=makeSnapshot();

 state.cols=cols;
 state.rows=rows;
 state.warps=warps;
 state.wefts=wefts;

 state.selectedWeft=Math.min(
  state.selectedWeft,
  wefts-1
 );

 for(const key of Object.keys(state.marks)){

  const [r,c,k]=key.split(",").map(Number);

  if(r>=rows||c>=cols||k>=wefts){
   delete state.marks[key];
  }
 }

 const after=makeSnapshot();

 if(!snapshotsEqual(before,after)){
  pushHistory(before);
 }

 renderWarpControls();
 renderWeftControls();
 draw();
 saveState();
}

/* خروجی JPG */

function exportJPG(){

 const link=document.createElement("a");

 link.download="Fabric-Analyzer.jpg";
 link.href=canvas.toDataURL("image/jpeg",0.98);

 link.click();
}

document.getElementById("jpgBtn")
 .addEventListener("click",exportJPG);

/* میانبرهای صفحه‌کلید */

document.addEventListener("keydown",event=>{

 const key=event.key.toLowerCase();
 const ctrl=event.ctrlKey||event.metaKey;
 const target=event.target;

 const isColorInput=
  target instanceof HTMLInputElement&&
  target.type==="color";

 const isEditable=
  target instanceof HTMLInputElement||
  target instanceof HTMLTextAreaElement||
  target.isContentEditable;

 /* Enter برای اعمال تنظیمات */
 if(
  event.key==="Enter"&&
  !event.shiftKey&&
  !event.altKey&&
  !isColorInput
 ){
  event.preventDefault();
  applySettings();
  return;
 }

 if(!ctrl)return;

 if(key==="s"){
  event.preventDefault();
  exportJPG();
  return;
 }

 if(key==="enter"){
  event.preventDefault();
  applySettings();
  return;
 }

 if(key==="z"&&!event.shiftKey){

  if(isEditable&&!isColorInput)return;

  event.preventDefault();
  undo();
  return;
 }

 if(key==="y"||(key==="z"&&event.shiftKey)){

  if(isEditable&&!isColorInput)return;

  event.preventDefault();
  redo();
 }
});

/* شروع برنامه */

loadState();
syncInputs();

renderWarpControls();
renderWeftControls();

updateLockUI();
updateHistoryButtons();

draw();

window.addEventListener("resize",draw);

</script>
</body>
